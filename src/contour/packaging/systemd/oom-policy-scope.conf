# Installed by Contour, for the systemd scope a desktop launches Contour into.
#
# An out-of-memory kill of any process inside this scope -- a program a session started that could not
# be moved into a scope of its own -- would otherwise stop the whole scope (systemd's default,
# OOMPolicy=stop): Contour and every tab. Contour cannot change its own running scope's OOMPolicy, so it
# is set here: systemd applies it to each scope a desktop creates from now on, and to one already running
# at the next `systemctl --user daemon-reload`. Scopes have OOMPolicy= since systemd 253; an older systemd
# ignores this file, with an "Unknown key name 'OOMPolicy' in section 'Scope'" warning in its journal.
# See docs/internals/session-oom-isolation.md.
[Scope]
OOMPolicy=continue
