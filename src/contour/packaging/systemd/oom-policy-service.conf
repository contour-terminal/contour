# Installed by Contour, for the systemd service a desktop launches Contour as.
#
# An out-of-memory kill of any process inside this unit -- a program a session started that could not
# be moved into a scope of its own -- would otherwise stop the whole unit (systemd's default,
# OOMPolicy=stop): Contour and every tab. Contour cannot change its own running unit's OOMPolicy, so it
# is set here: systemd applies it to each unit a desktop creates from now on, and to one already running
# at the next `systemctl --user daemon-reload`. Services have OOMPolicy= since systemd 243.
# See docs/internals/session-oom-isolation.md.
[Service]
OOMPolicy=continue
