name: Build

on:
  merge_group:
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.yml'
      - 'LICENSE.txt'
      - 'mkdocs.yml'
      - '*.md'
      - '*.sh'
    branches:
      - master
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.yml'
      - 'LICENSE.txt'
      - 'mkdocs.yml'
      - '*.md'
      - '*.sh'
    branches:
      - master

concurrency:
  group: build-${{ github.ref }}
  # A master run is never cancelled by the next push: it is the one that saves the compiler cache.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Turn the workflow lint's offline skip into a hard failure. `check-workflows.py` skips when it
  # cannot obtain actionlint, so that a fresh offline clone still gets a green `ctest`; in CI that
  # would mean a gate quietly passing because its download failed, which is worse than no gate.
  # Set at workflow level so it covers every job here that runs `ctest` -- the Linux matrix and
  # packaging jobs and the Windows and macOS jobs, all through `ctest -j`.
  CHECK_WORKFLOWS_REQUIRE_TOOL: 1
  # Single source of truth for the LLVM/Clang toolchain version used across this workflow
  # (clang-format, clang-tidy and the Clang build matrix). Bump this one value to upgrade.
  LLVM_VERSION: "22"
  # How every ccache in this workflow keys an object, so that a hit does not depend on where or when
  # the object was built. BASEDIR makes paths under the checkout relative, NOHASHDIR keeps the
  # build directory out of the key, and the two sloppiness flags stop a header's mtime/ctime --
  # which a fresh checkout always changes -- from defeating a hit. (No pch_defines: there is no PCH.)
  # The caches themselves are saved by `push` runs only and merely restored by pull requests; see
  # docs/internals/build-times.md ("The compiler cache").
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "1"
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime

# What runs where. A pull request runs the platform builds and tests (Windows, macOSArm, one Linux
# leg) plus the guard builds, the lint jobs and clang-tidy on the changed lines. Everything else --
# the other compiler legs, packaging, valgrind, conformance, bench, notcurses -- runs on master
# pushes and in the merge queue, and on the `release` branch's pull request, through
# `if: github.event_name != 'pull_request' || github.head_ref == 'release'`. Exceptions: FreeBSD and
# the full-tree clang-tidy use `github.event_name != 'pull_request'` and skip even the `release`
# pull request, and the static build (`github.ref == 'refs/heads/master' || head_ref == 'release'`)
# never runs in the merge queue. The daemon packages: the Debian one (`package_daemon_for_Ubuntu`) runs
# on every pull request, for 24.04 alone (both releases otherwise), because it is the only job that
# builds the GUI-less configuration; the RPMs (`package_for_Fedora`) follow the packaging rule above.
# A required status check is never gated that way: it always runs and judges a skipped job as passed
# (scripts/check-workflows.py enforces it). See docs/internals/build-times.md.

jobs:

  # {{{ Common checks
  check_common:
    name: "Check CI scripts"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: "Checking for common errors in build, deployment, and CI."
      run: ./scripts/check-common.sh

  check_PR_TODOs:
    name: "Check PR-TODOs"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: "Checking for open PR-related TODO items"
      run: ./scripts/check-pr-todos.sh

  check_clang_format:
    name: "Check C++ style"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh "$LLVM_VERSION"
        sudo apt-get install "clang-format-$LLVM_VERSION"
    # The predicates must stay grouped: an ungrouped `-o` binds looser than any predicate added
    # later (e.g. -print0), which would silently reduce the file set instead of failing.
    # `*.h` is not dead weight: src/vtrasterizer/shared_defines.h keeps that extension because it
    # is shared with GLSL, and it is still a file we format.
    - name: "Clang-format"
      run: find ./src/ \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \) -print0 | xargs -0 "clang-format-$LLVM_VERSION" --Werror --dry-run
    - name: "Check includes"
      run: ./scripts/check-includes.sh
    # vendor/core-cpp is a verbatim copy of a core-cpp release (vendor/README.md). The same check
    # runs as the `core-cpp-vendored-copy` ctest; here it runs on every push, with no build.
    - name: "Check the vendored core-cpp copy is verbatim"
      run: cmake -DMODE=check -DDEST=vendor/core-cpp -P vendor/core-cpp/cmake/CoreCppVendor.cmake

  # The whole tree, on every push to master and every merge-queue run. Pull requests run
  # check_clang_tidy_diff below instead: the same checks on the lines the PR changed, without
  # compiling the tree.
  check_clang_tidy:
    name: "Check clang-tidy"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: "ccache-ubuntu2404-clang-tidy"
        max-size: 700M
        save: ${{ github.event_name == 'push' }}
        evict-old-files: job
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set environment variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - name: "install dependencies"
      run: sudo env QTVER=6 ./scripts/install-deps.sh
    - name: "Post-fix embedded dependency permissions."
      run: sudo find _deps/sources -exec chown $UID {} \;
    # Ubuntu 24.04's distro Qt (6.4.2) lacks the Qt6::GuiPrivate CMake package the RHI renderer needs;
    # install a modern Qt6 over it (see the build matrix job for the same rationale).
    #
    # Pinned to 6.11.1 rather than tracking 6.11.*: 6.11.2's Linux AARCH64 qttools archive is
    # corrupt where it is published, so unpacking it dies with
    # `zipfile.BadZipFile: Bad offset for central directory` and takes the whole install with it.
    # Every arm64 job started failing the moment 6.11.2 appeared, while yesterday's runs on 6.11.1
    # were green and today's x86_64 runs on 6.11.2 still are -- only the AARCH64 archive is bad.
    # Raise this once a later 6.11 publishes an archive that unpacks. See the retry below for why
    # re-running does not help here.
    #
    # Attempted twice all the same: aqtinstall pulls each archive from whichever mirror
    # download.qt.io redirects it to, so a mirror that serves a truncated file is a verdict on the
    # mirror, not on the commit under test, and re-resolving the redirect usually lands elsewhere.
    # It buys nothing against a corrupt *upstream* archive -- both attempts fetched the bad qttools
    # from two different mirrors -- which is what the pin above is for. Only a repeated failure
    # fails the job.
    - name: "Install Qt (GuiPrivate-capable)"
      id: install_qt
      continue-on-error: true
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: "Install Qt (GuiPrivate-capable) -- retry past a bad mirror"
      if: steps.install_qt.outcome == 'failure'
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${LLVM_VERSION}
        sudo apt-get install clang-tidy-${LLVM_VERSION}
    # Catches stale/misspelled option keys and removed config directives in seconds,
    # rather than letting them silently no-op through a full tidy build.
    - name: "Verify clang-tidy configuration"
      run: CLANG_TIDY=clang-tidy-${LLVM_VERSION} ./scripts/check-clang-tidy-config.sh
    # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
    # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
    - name: "install Rust (wasm32-wasip1)"
      run: ./scripts/install-rust-wasm.sh
    # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
    # unicode.org outage used to fail the configure step of every job at once.
    - name: "Unicode database"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: _ucd
        key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
    - name: "cmake"
      run: |
        cmake \
              --preset clang-debug \
              -B build \
              -G Ninja \
              -D CONTOUR_WAYLAND=OFF \
              -D LIBUNICODE_UCD_BASE_DIR="$PWD/_ucd" \
              -D CMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
              -D ENABLE_TIDY=ON \
              -D CLANG_TIDY_EXE=/usr/bin/clang-tidy-${LLVM_VERSION}
    - name: "build"
      run: cmake --build build

  # clang-tidy on the lines a pull request changed, and nothing else. scripts/tidy-diff-plan.py maps
  # each changed line to a translation unit (a changed header goes through one TU that includes it)
  # and fails on a header no TU includes, so a change is linted or the job is red -- never skipped.
  # Only the generated headers are built, not the tree, which is what makes this fast.
  check_clang_tidy_diff:
    name: "Check clang-tidy (diff)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set environment variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - name: "install dependencies"
      run: sudo env QTVER=6 ./scripts/install-deps.sh
    - name: "Post-fix embedded dependency permissions."
      run: sudo find _deps/sources -exec chown $UID {} \;
    # Ubuntu 24.04's distro Qt (6.4.2) lacks the Qt6::GuiPrivate CMake package the RHI renderer needs;
    # install a modern Qt6 over it (see the build matrix job for the same rationale).
    #
    # Pinned to 6.11.1 rather than tracking 6.11.*: 6.11.2's Linux AARCH64 qttools archive is
    # corrupt where it is published, so unpacking it dies with
    # `zipfile.BadZipFile: Bad offset for central directory` and takes the whole install with it.
    # Every arm64 job started failing the moment 6.11.2 appeared, while yesterday's runs on 6.11.1
    # were green and today's x86_64 runs on 6.11.2 still are -- only the AARCH64 archive is bad.
    # Raise this once a later 6.11 publishes an archive that unpacks. See the retry below for why
    # re-running does not help here.
    #
    # Attempted twice all the same: aqtinstall pulls each archive from whichever mirror
    # download.qt.io redirects it to, so a mirror that serves a truncated file is a verdict on the
    # mirror, not on the commit under test, and re-resolving the redirect usually lands elsewhere.
    # It buys nothing against a corrupt *upstream* archive -- both attempts fetched the bad qttools
    # from two different mirrors -- which is what the pin above is for. Only a repeated failure
    # fails the job.
    - name: "Install Qt (GuiPrivate-capable)"
      id: install_qt
      continue-on-error: true
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: "Install Qt (GuiPrivate-capable) -- retry past a bad mirror"
      if: steps.install_qt.outcome == 'failure'
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${LLVM_VERSION}
        sudo apt-get install clang-tidy-${LLVM_VERSION}
    - name: "install Rust (wasm32-wasip1)"
      run: ./scripts/install-rust-wasm.sh
    # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
    # unicode.org outage used to fail the configure step of every job at once.
    - name: "Unicode database"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: _ucd
        key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
    - name: "cmake"
      run: |
        cmake \
              --preset clang-debug \
              -B build \
              -G Ninja \
              -D CONTOUR_WAYLAND=OFF \
              -D LIBUNICODE_UCD_BASE_DIR="$PWD/_ucd" \
              -D CMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
              -D ENABLE_TIDY=OFF
    - name: "build generated headers only"
      run: ./scripts/ci-build-tidy-prerequisites.sh build
    - name: "clang-tidy on the changed lines"
      run: |
        CLANG_TIDY=clang-tidy-${LLVM_VERSION} ./scripts/clang-tidy-diff.sh \
              --base origin/${{ github.base_ref }} \
              --build-dir build

  # Builds, tests, packages and install-tests the GUI-less configuration, whose product is `contour daemon`
  # -- a session host for a server or a container -- shipped as the `contour-daemon` Debian package.
  # Being unbuilt is exactly how this configuration rotted before; one job is what keeps a new GUI source
  # from landing outside its CONTOUR_FRONTEND_GUI guard. It replaces `build_headless`, and so carries every
  # guard that job had, and it runs on EVERY pull request: nothing but the artifact upload is conditional.
  #
  # Deliberately NOT installing a modern Qt over the distro one: relying on Ubuntu's Qt 6.4.2
  # proves the headless build needs nothing beyond Qt6::Core -- no Qt6::GuiPrivate, no Qt Quick.
  # Clang only, since this gates a build configuration and not a toolchain. RelWithDebInfo rather than
  # Debug, because the product is a package: it is what a user installs, and what carries a -dbgsym.
  package_daemon_for_Ubuntu:
    name: "Ubuntu Linux (contour-daemon package, ${{ matrix.os_version }})"
    # 24.04 is the oldest release the package is built for and runs on every pull request. 26.04 is the
    # release the GUI package is built on, so the swap job below can install both from one release; it is
    # a second full build, hence not on ordinary pull requests.
    strategy:
      fail-fast: false
      matrix:
        os_version: ${{ fromJSON(github.event_name == 'pull_request' && github.head_ref != 'release' && '["24.04"]' || '["24.04","26.04"]') }}
    runs-on: ubuntu-${{ matrix.os_version }}
    env:
      OS_VERSION: ${{ matrix.os_version }}
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: "ccache-ubuntu${{ matrix.os_version }}-headless"
        max-size: 500M
        save: ${{ github.event_name == 'push' }}
        evict-old-files: job
    - name: "install dependencies"
      run: sudo env QTVER=6 ./scripts/install-deps.sh
    - name: "Post-fix embedded dependency permissions."
      run: sudo find _deps/sources -exec chown $UID {} \;
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${LLVM_VERSION}
    # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
    # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
    - name: "install Rust (wasm32-wasip1)"
      run: ./scripts/install-rust-wasm.sh
    # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
    # unicode.org outage used to fail the configure step of every job at once.
    - name: "Unicode database"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: _ucd
        key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
    # CMAKE_DISABLE_FIND_PACKAGE_Qt6 makes every find_package(Qt6 ...) fail, so this configuration
    # cannot merely happen to build against a Qt that is lying around -- it has to want none. The
    # step above installed Qt, which is what makes the assertion worth anything: the point is not
    # that Qt is absent from the runner, it is that the build never reaches for it. Issue #2042 is
    # reported from a machine where Qt6 does not exist at all.
    #
    # CMAKE_INSTALL_PREFIX=/usr: the package installs under /usr, like the GUI one.
    #
    # PEDANTIC_COMPILER_WERROR=OFF: this is a release/packaging build, and no other job builds
    # clang-release (the GUI packaging job turns -Werror off as well). No Linux pull-request job builds
    # the GUI-less tree with -Werror: the sources it shares with the GUI builds are checked there, and
    # docs.yml's gcc-debug job (merge queue, GCC 14, GUI-less, -Werror=ON) compiles the `contour` target
    # GUI-less. build_headless_macos only configures. A release-only warning must not block packaging.
    #
    # CONTOUR_PACKAGE_TERMINFO=OFF, like the GUI .deb: the contour terminfo entry is probably shipped by
    # the distribution's ncurses packages already, and packaging it again would risk a file conflict on
    # install. (Inferred, not verified: the commit that added the option, 0955d59c8, gives no reason.
    # A host lacking the entry falls back to TERM=xterm-256color per Config.cpp, so the downside is mild.)
    - name: "cmake"
      run: |
        cmake \
              --preset clang-release \
              -B build \
              -G Ninja \
              -D CMAKE_INSTALL_PREFIX=/usr \
              -D CONTOUR_WAYLAND=OFF \
              -D LIBUNICODE_UCD_BASE_DIR="$PWD/_ucd" \
              -D CONTOUR_FRONTEND_GUI=OFF \
              -D CONTOUR_TESTING=ON \
              -D CONTOUR_PACKAGE_TERMINFO=OFF \
              -D PEDANTIC_COMPILER_WERROR=OFF \
              -D CMAKE_DISABLE_FIND_PACKAGE_Qt6=ON \
              -D CONTOUR_LINK_JOBS=1 \
              -D CMAKE_C_COMPILER="clang-${LLVM_VERSION}" \
              -D CMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}"
    # One link at a time (CONTOUR_LINK_JOBS above): the runner was shut down three runs in a row at the
    # same step, while contour and contour_test linked side by side -- memory, not time (see #2186).
    - name: "build"
      run: cmake --build build --target contour contour_test
    # ...and that the linked result carries no Qt either, which the configure-time gate above cannot
    # see: a transitive Qt6::Core from some other target would still land here.
    - name: "verify the binary links no Qt"
      run: |
        set -eu
        if ldd build/src/contour/contour | grep -i "libQt"; then
          echo "::error::GUI-less build links Qt"
          exit 1
        fi
    # contour_test is the unit suite for the layers this configuration is made of -- the
    # configuration model, the command vocabulary and the CLI -- and it links no Qt, which is the
    # only reason it can run here at all. Before it existed, this job built the binary and asserted
    # nothing about its behaviour.
    #
    # contour_e2e_cli_verbs asserts the verb surface this configuration is supposed to expose --
    # `daemon` present, `client` gone. contour_e2e_shell_integration asserts that `generate
    # integration` still emits the scripts verbatim, which is the verb that used to read them out of
    # a Qt resource. All three are ctest tests rather than steps of this job, so they also run in the
    # ordinary GUI builds, where they assert the other half.
    - name: "tests"
      run: ctest --test-dir build -R "contour_test|contour_e2e_cli_verbs|contour_e2e_shell_integration|contour_e2e_packaging_rules" --output-on-failure
    # Building is not the same as being installable: this configuration reached issue #1780 with a
    # `contour` binary that compiled and an install target that errored out on a missing one. The
    # install rules are a per-configuration decision, so they need a per-configuration run.
    # --component contour, because the build step above builds the `contour` target alone: a full
    # install would also want vtbackend's bench-headless, which was never compiled. The component is
    # exactly the set of rules this job is here to exercise.
    - name: "install"
      run: |
        set -eu
        cmake --install build --prefix "$RUNNER_TEMP/contour-headless" --component contour
        test -x "$RUNNER_TEMP/contour-headless/bin/contour"
        test -f "$RUNNER_TEMP/contour-headless/share/contour/shell-integration/shell-integration.zsh"
        # The daemon runs extensions too, so the GUI-less configuration ships the bundled ones.
        for extension in agent-status clock git plasma sysload; do
          test -f "$RUNNER_TEMP/contour-headless/share/contour/extensions/$extension.wasm"
        done
    # The package files are found by glob and counted rather than named: CPack derives the file name
    # (contour-daemon_<version>_<arch>.deb, and the debug-info package beside it), and a name guessed
    # here would be a second place to keep in step with it. Exactly one of each, or the step says which.
    - name: "CPack: Creating DEB package"
      run: |
        set -eu
        # -G DEB: nothing on Linux sets CPACK_GENERATOR (the GUI job gets DEB from the gcc-release
        # package preset), and without it cpack builds tarballs. It also writes the -dbgsym .ddeb.
        cpack -G DEB -B build --config build/CPackConfig.cmake
        ls -la build
        pick() {
          # pick <glob-pattern> <what>: print the single file under build/ matching it.
          local matches count
          matches=$(find build -maxdepth 1 -type f -name "$1" | sort)
          count=$(printf '%s' "$matches" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one $2 ($1) in build/, found $count:" >&2
            printf '%s\n' "$matches" >&2
            exit 1
          fi
          printf '%s\n' "$matches"
        }
        deb=$(pick 'contour-daemon*.deb' 'contour-daemon .deb')
        ddeb=$(pick 'contour-daemon*.ddeb' 'contour-daemon debug-info .ddeb')
        mv -v "$deb" "contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${OS_VERSION}-amd64.deb"
        mv -v "$ddeb" "contour-daemon-dbgsym-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${OS_VERSION}-amd64.ddeb"
    - name: "Inspect the package"
      run: |
        set -eu
        deb="contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${OS_VERSION}-amd64.deb"
        dpkg-deb -I "$deb"
        dpkg-deb -c "$deb"
        depends=$(dpkg-deb -f "$deb" Depends)
        echo "Depends: $depends"
        if printf '%s' "$depends" | grep -Eiq 'qt|qml'; then
          echo "::error::contour-daemon depends on Qt: $depends"
          exit 1
        fi
        test "$(dpkg-deb -f "$deb" Package)" = contour-daemon
    # A clean machine is what a user has, and the runner is not one: it carries Qt, the whole build
    # toolchain and more. So the package is installed into a bare ubuntu image. `apt-get install ./file`
    # resolves its Depends from the archive, which is the point: nothing Qt may come with it. The script
    # runs as root inside the container; the repository checkout is mounted read-only.
    - name: "Install the package in a clean ubuntu:${{ matrix.os_version }}"
      run: |
        docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD:/pkg:ro" ubuntu:${{ matrix.os_version }} bash -euxc '
          apt-get update
          apt-get install -y "/pkg/contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
          dpkg -s contour-daemon
          if dpkg -s contour-daemon | grep "^Depends:" | grep -Eiq "qt|qml"; then echo "Qt in Depends"; exit 1; fi
          if dpkg -l | grep -Ei "libqt|qml6|qt6"; then echo "a Qt package was pulled in"; exit 1; fi
          test -x /usr/bin/contour
          if ldd /usr/bin/contour | grep -i "libQt\|not found"; then echo "bad link"; exit 1; fi
          contour version
          contour help | grep -q "contour daemon"
          test -f /usr/lib/systemd/user/contour-daemon.service
          for extension in agent-status clock git plasma sysload; do
            test -f "/usr/share/contour/extensions/$extension.wasm"
          done
        '
    # Uploaded wherever the GUI package is, and no more widely: the install-swap job and the release
    # take it from here. The steps above are what run on a pull request.
    - name: "Uploading artifact .deb package"
      if: github.event_name != 'pull_request' || github.head_ref == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: "contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
        path: |
          contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb
          contour-daemon-dbgsym-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.ddeb
        if-no-files-found: error
        retention-days: 7

  # The two Debian packages ship the same /usr/bin/contour and declare Conflicts/Replaces on each other,
  # so installing either over the other must leave exactly one of them, with exactly one binary. That
  # needs BOTH packages, and the GUI one is only built by package_for_Ubuntu (on 26.04, and not on pull
  # requests), so this job needs both packaging jobs, downloads their artifacts, and runs where they
  # exist. On a pull request the daemon-only install test above is what runs.
  #
  # ubuntu:26.04, the release the GUI package is built for, with the daemon package built on that same
  # release (the 26.04 matrix entry above), so neither package meets a soname or virtual-package skew
  # that a user installing from one release would not. The swap job is restricted to non-PR / release
  # events, hence the swap behaviour is first exercised on release branches, not on ordinary pull
  # requests (the PR description states it).
  test_daemon_package_swap:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Ubuntu Linux (contour / contour-daemon swap)"
    runs-on: ubuntu-24.04
    needs:
      - package_for_Ubuntu
      - package_daemon_for_Ubuntu
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - name: "fetch artifact: contour (GUI)"
      uses: actions/download-artifact@v4
      with:
        name: contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
        path: pkg
    - name: "fetch artifact: contour-daemon (26.04)"
      uses: actions/download-artifact@v4
      with:
        name: contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
        path: pkg
    - name: "Swap the packages in a clean ubuntu:26.04"
      run: |
        ls -la pkg
        docker run --rm -e DEBIAN_FRONTEND=noninteractive -v "$PWD/pkg:/pkg:ro" ubuntu:26.04 bash -euxc '
          gui=/pkg/contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
          daemon=/pkg/contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
          apt-get update

          # Asserts which of the two packages is installed, and that /usr/bin/contour is a single file.
          expect_only() {
            local present=$1 absent=$2
            dpkg -s "$present" | grep -q "^Status: install ok installed"
            if dpkg -s "$absent" 2>/dev/null | grep -q "^Status: install ok installed"; then
              echo "$absent is still installed after installing $present"; exit 1
            fi
            test -x /usr/bin/contour
            test "$(dpkg -S /usr/bin/contour | wc -l)" -eq 1
            dpkg -S /usr/bin/contour | grep -q "^$present:"
          }

          # apt-get install ./file is the way a user installs a downloaded .deb, and it is what lets the
          # Conflicts remove the other package instead of refusing.
          apt-get install -y "$daemon"
          expect_only contour-daemon contour
          apt-get install -y "$gui"
          expect_only contour contour-daemon
          apt-get install -y "$daemon"
          expect_only contour-daemon contour
        '

  # CONTOUR_EXTENSIONS=OFF compiles the status-line extensions out, and with them every type the code that
  # drives them names: whatever reaches for one outside its #ifdef breaks this configuration alone, which no
  # other job builds -- a break in TerminalSession went unnoticed that way. Build-only, GUI included: what it
  # guards is that the sources compile and link without the feature; the suites run in the jobs with it.
  build_no_extensions:
    name: "Ubuntu Linux (no status-line extensions)"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: "ccache-ubuntu2404-no-extensions"
        max-size: 700M
        save: ${{ github.event_name == 'push' }}
        evict-old-files: job
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: "install dependencies"
      run: sudo env QTVER=6 ./scripts/install-deps.sh
    - name: "Post-fix embedded dependency permissions."
      run: sudo find _deps/sources -exec chown $UID {} \;
    # The distro Qt (6.4.2) lacks the private CMake packages the GUI needs; the same modern Qt as the
    # job above, and the same retry past a bad mirror.
    - name: "Install Qt (GuiPrivate-capable)"
      id: install_qt
      continue-on-error: true
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: "Install Qt (GuiPrivate-capable) -- retry past a bad mirror"
      if: steps.install_qt.outcome == 'failure'
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.11.1"
        modules: qtmultimedia qt5compat qtshadertools qtspeech
    - name: Install clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${LLVM_VERSION}
    # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
    # unicode.org outage used to fail the configure step of every job at once.
    - name: "Unicode database"
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: _ucd
        key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
    # No Rust: without extensions there are no WebAssembly guests to build (CONTOUR_EXTENSIONS_BUNDLED
    # follows CONTOUR_EXTENSIONS).
    - name: "cmake"
      run: |
        cmake \
              --preset clang-debug \
              -B build \
              -G Ninja \
              -D CONTOUR_WAYLAND=OFF \
              -D LIBUNICODE_UCD_BASE_DIR="$PWD/_ucd" \
              -D CONTOUR_EXTENSIONS=OFF \
              -D CONTOUR_TESTING=ON \
              -D CMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}"
    - name: "build"
      run: cmake --build build

  # The macOS half of the same guard. A .app bundle, macdeployqt and a signed .dmg all serve a
  # window; a GUI-less build has none, so it must install a plain bin/contour like any other Unix
  # CLI tool. The Linux job above cannot assert that -- it never enters CMake's APPLE branch.
  #
  # Configure-only on purpose: what this checks is which rules the configuration GENERATES, and
  # every way it can go wrong (a REQUIRED find_package for a GUI module, a macdeployqt lookup, an
  # install rule that stages a bundle) is decided at configure time. Compiling the same headless
  # sources a second time would only repeat the job above at several times the cost.
  build_headless_macos:
    name: "macOS (no GUI frontend)"
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    # CONTOUR_INSTALL_BREW_QT: install-deps.sh leaves Qt out on macOS because Homebrew's split
    # per-module prefixes break macdeployqt for release bundles. This build makes no bundle, so the
    # Homebrew Qt is exactly the "dev build that is never packaged" case that script documents.
    # It is installed here even though this configuration must not use it, for the same reason as in
    # the Linux job: a Qt that is present and still untouched is the assertion worth making.
    - name: "install dependencies"
      run: env CONTOUR_INSTALL_BREW_QT=ON QTVER=6 ./scripts/install-deps.sh
    # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
    # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
    - name: "install Rust (wasm32-wasip1)"
      run: ./scripts/install-rust-wasm.sh
    - name: "cmake"
      run: |
        cmake \
              --preset appleclang-debug \
              -B build \
              -D CONTOUR_FRONTEND_GUI=OFF \
              -D CONTOUR_TESTING=OFF \
              -D CMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
    - name: "verify no app-bundle machinery was generated"
      run: |
        set -eu
        for pattern in macdeployqt contour.app DragNDrop MacOSNotarizeApp MacOSSignDmg; do
          if grep -qF "$pattern" build/src/contour/cmake_install.cmake build/CPackConfig.cmake; then
            echo "::error::GUI-less macOS build still generates '$pattern' rules"
            exit 1
          fi
        done
        # ...and that it still installs SOMETHING: the rules must have moved to the CLI branch, not
        # gone missing with the bundle they used to live next to.
        if ! grep -q 'CMAKE_INSTALL_PREFIX}/bin" TYPE EXECUTABLE' build/src/contour/cmake_install.cmake; then
          echo "::error::GUI-less macOS build installs no executable into bin/"
          exit 1
        fi
        # The bundled extensions go beside bin/, into share/contour/extensions: with no app bundle, that is
        # where bundledExtensionDirectories() looks on macOS (BundledExtensions_test pins it), after the
        # bundle's Resources it does not have.
        if ! grep -q 'share/contour/extensions" TYPE FILE' build/src/contour/cmake_install.cmake; then
          echo "::error::GUI-less macOS build installs no bundled extensions into share/contour/extensions"
          exit 1
        fi

  check_links:
    name: "Check links"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run linksafe
        uses: Yaraslaut/linksafe@main
        with: # comma separated lists
          # use relative paths, if no dirs specified root dir is scanned
          ignored_dirs: "_deps"
          ignored_files: "./scripts/install-deps.sh,
                          ./scripts/install-deps.ps1"
          ignored_links: "https://www.contributor-covenant.org/faq,
                          https://www.contributor-covenant.org,
                          https://flatpak.org/getting.html,
                          https://codeberg.org/dnkl/foot,
                          https://codecov.io/gh/contour-terminal/contour,
                          https://msdn.microsoft.com/zh-cn/library/f4k12ae8,
                          https://msdn.microsoft.com/en-us/library/fzt08www,
                          "

  editorconfig:
    name: "Check editorconfig"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: editorconfig-checker/action-editorconfig-checker@main
      - run: editorconfig-checker
  # }}}
  # {{{ StaticBuild
  staticBuild:
    if: github.ref == 'refs/heads/master' || github.head_ref == 'release'
    name: "Static build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: all
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars
        run: sudo apt -qy install libxml2-utils
      - name: Build release
        shell: bash
        run: |
          docker buildx build  \
          --tag static_contour \
          --progress=plain \
          -f .github/static/DockerUbuntu \
          --load \
          .
          docker create --name contour_static static_contour
          docker cp contour_static:/contour/build/src/contour/contour contour
          docker container rm contour_static
      - name: "Uploading static executable"
        uses: actions/upload-artifact@v4
        with:
          name: "contour"
          path: "contour"
          if-no-files-found: error
          retention-days: 1
  # }}}
  # {{{ Fedora
  # Builds BOTH RPMs from the one spec, .github/fedora/contour.spec: the GUI `contour`, and with
  # `--with daemon` the Qt-free `contour-daemon`, then installs them in clean Fedora containers -- the
  # runner carries Qt and a toolchain, so it is no evidence of what a user's machine needs.
  #
  # Current Fedora is the supported target, and rawhide is the early warning for the next one, so a break
  # there is reported but never holds a release back (continue-on-error). EL9 and EL10 (CentOS Stream,
  # Alma, Rocky) have no job: EL9's GCC 11 cannot build the C++23 sources (it would need gcc-toolset, plus
  # EPEL for yaml-cpp and libutempter), and a job that can never be run by hand first -- the EL10 package
  # set is unverified -- would be a guess committed to CI. Revisit with a machine to try it on.
  #
  # Two full RelWithDebInfo builds per leg, so like the other packaging it runs on master pushes, in the
  # merge queue and on the `release` pull request, not on ordinary pull requests: the Ubuntu daemon job
  # already builds the GUI-less configuration on every one.
  package_for_Fedora:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Fedora ${{ matrix.os_version }} (contour and contour-daemon RPMs)"
    strategy:
      fail-fast: false
      matrix:
        # Keep the stable entry in step with do_release's fetch below and the Dockerfile's default.
        os_version: ["44", "rawhide"]
    continue-on-error: ${{ matrix.os_version == 'rawhide' }}
    runs-on: ubuntu-24.04
    env:
      OS_VERSION: ${{ matrix.os_version }}
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - name: Fetch and unpack embeds
      run: ./scripts/install-deps.sh
      env:
        PREPARE_ONLY_EMBEDS: 'ON'
        SYSDEP_ASSUME_YES: 'ON'
        OS_OVERRIDE: 'fedora'
    - name: "Post-fix embedded dependency permissions."
      run: sudo find _deps/sources -exec chown $UID {} \;
    - name: prepare distfile
      run: |
        set -ex
        PKGNAME="contour-${{ steps.set_vars.outputs.VERSION }}"
        DISTDIR="/tmp/dist/${PKGNAME}"
        mkdir -p ${DISTDIR}
        cp -rvp . ${DISTDIR}
        tar czpf ${PKGNAME}.tar.gz -C "/tmp/dist" .
    # A packaging build, not a warnings gate: the clang-debug jobs enforce zero warnings, and a warning
    # from a newer GCC (rawhide) must not stop a package from being built.
    - name: disable -Werror for the package build
      run: sed -i -e "s/PEDANTIC_COMPILER_WERROR=ON/PEDANTIC_COMPILER_WERROR=OFF/" .github/fedora/contour.spec
    # The RPM Version is the dotted VERSION: VERSION_STRING carries a `-prerelease` suffix, and a hyphen
    # is not allowed in an RPM version. The artifacts below are named with VERSION_STRING, like the .deb.
    - name: "Build both RPMs"
      run: |
        set -eux
        VERSION="${{ steps.set_vars.outputs.VERSION }}"
        docker build \
                --tag contour-rpm \
                --build-arg VERSION=${VERSION} \
                --build-arg FEDORA_VERSION=${OS_VERSION} \
                -f .github/fedora/Dockerfile \
                .
        docker create --name contour-rpm contour-rpm
        mkdir -p rpms
        docker cp contour-rpm:/app/rpmbuild/RPMS/x86_64/. rpms/
        docker rm contour-rpm
        ls -la rpms
    # The built files are renamed to <name>-<VERSION_STRING>-fedora<release>-x86_64.rpm (and the
    # -debuginfo/-debugsource beside each): the release tag is in the name because the dist tag of
    # rawhide is not known in advance, and the VERSION_STRING because that is what the .deb carries.
    - name: "Name the packages"
      run: |
        set -eux
        VERSION="${{ steps.set_vars.outputs.VERSION }}"
        VERSION_STRING="${{ steps.set_vars.outputs.VERSION_STRING }}"
        for rpm in rpms/*.rpm; do
          base=$(basename "$rpm")
          stem="${base%%-"${VERSION}"-1.*}"
          mv -v "$rpm" "${stem}-${VERSION_STRING}-fedora${OS_VERSION}-x86_64.rpm"
        done
        # Exactly the six packages: contour and contour-daemon, each with its debuginfo and debugsource.
        test "$(find . -maxdepth 1 -name "contour-*-fedora${OS_VERSION}-x86_64.rpm" | wc -l)" -eq 6
        ls -la ./*.rpm
    # What the packages say about themselves, read inside a Fedora container (it has rpm; the Ubuntu
    # runner does not). The daemon must name no Qt and ship no desktop files; the GUI package must still
    # ship them; and each declares the conflict with the other.
    - name: "Inspect the packages"
      run: |
        set -eu
        docker run --rm -e OS_VERSION -v "$PWD:/pkg:ro" fedora:"${OS_VERSION}" bash -euxc '
          daemon=/pkg/contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm
          gui=/pkg/contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm
          test "$(rpm -qp --qf "%{NAME}" "$daemon")" = contour-daemon
          test "$(rpm -qp --qf "%{NAME}" "$gui")" = contour
          rpm -qpR "$daemon"
          if rpm -qpR "$daemon" | grep -i "qt6"; then echo "contour-daemon requires Qt"; exit 1; fi
          rpm -qpl "$daemon"
          rpm -qpl "$daemon" | grep -qx /usr/bin/contour
          rpm -qpl "$daemon" | grep -qx /usr/lib/systemd/user/contour-daemon.service
          if rpm -qpl "$daemon" | grep -E "\.desktop$|/icons/|/metainfo/|/app-.*\.d"; then echo "desktop files in contour-daemon"; exit 1; fi
          rpm -qpl "$gui" | grep -qx /usr/bin/contour
          rpm -qpl "$gui" | grep -qx /usr/lib/systemd/user/contour-daemon.service
          rpm -qpl "$gui" | grep -q "\.desktop$"
          rpm -qp --conflicts "$daemon" | grep -qx contour
          rpm -qp --conflicts "$gui" | grep -qx contour-daemon
        '
    # A clean machine is what a user has. dnf resolves the package's Requires from the repositories, which
    # is the point: nothing Qt may come with the daemon.
    - name: "Install contour-daemon in a clean fedora:${{ matrix.os_version }}"
      run: |
        docker run --rm -e OS_VERSION -v "$PWD:/pkg:ro" fedora:"${OS_VERSION}" bash -euxc '
          dnf install -y /pkg/contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm
          rpm -q contour-daemon
          if rpm -qa | grep -i "^qt6"; then echo "a Qt package was pulled in"; exit 1; fi
          test -x /usr/bin/contour
          if ldd /usr/bin/contour | grep -i "libQt\|not found"; then echo "bad link"; exit 1; fi
          contour version
          contour help | grep -q "contour daemon"
          test -f /usr/lib/systemd/user/contour-daemon.service
          # ...and the GUI package must refuse to be installed over it, on the declared conflict.
          if dnf install -y /pkg/contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm >/tmp/swap.log 2>&1; then
            cat /tmp/swap.log; echo "contour installed over contour-daemon"; exit 1
          fi
          cat /tmp/swap.log
          grep -qi conflict /tmp/swap.log
          rpm -q contour-daemon
        '
    - name: "Install contour in a clean fedora:${{ matrix.os_version }}, then refuse contour-daemon"
      run: |
        docker run --rm -e OS_VERSION -v "$PWD:/pkg:ro" fedora:"${OS_VERSION}" bash -euxc '
          dnf install -y /pkg/contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm
          rpm -q contour
          if dnf install -y /pkg/contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${OS_VERSION}-x86_64.rpm >/tmp/swap.log 2>&1; then
            cat /tmp/swap.log; echo "contour-daemon installed over contour"; exit 1
          fi
          cat /tmp/swap.log
          grep -qi conflict /tmp/swap.log
          rpm -q contour
        '
    - name: "Uploading Fedora RPM package: contour"
      uses: actions/upload-artifact@v4
      with:
        name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm"
        path: |
          contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
          contour-debuginfo-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
          contour-debugsource-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
        if-no-files-found: error
        retention-days: 7
    - name: "Uploading Fedora RPM package: contour-daemon"
      uses: actions/upload-artifact@v4
      with:
        name: "contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm"
        path: |
          contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
          contour-daemon-debuginfo-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
          contour-daemon-debugsource-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora${{ matrix.os_version }}-x86_64.rpm
        if-no-files-found: error
        retention-days: 7
  # }}}
  # {{{ FreeBSD
  freebsd:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Unversioned deliberately: the VM's release is whatever vmactions/freebsd-vm defaults to, which
    # has moved on to 15.1-RELEASE. This job was named "FreeBSD 13" long after that stopped being
    # true, and a name that states a version nothing pins is worse than none -- it invites reading
    # a failure as an old-toolchain problem when the VM is in fact running a current one.
    name: FreeBSD
    # env:
    #   MYTOKEN: "value1"
    #   MYTOKEN2: "value2"
    steps:
      - uses: actions/checkout@v4
      - name: Test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@v1
        # The VM builds every target from scratch with no compiler cache; master's run of
        # 2026-10-25 hit 60 minutes while still compiling, so the limit only bounds a hang.
        timeout-minutes: 120
        with:
          envs: 'MYTOKEN MYTOKEN2'
          usesh: true
          copyback: false
          prepare: pkg install -y wget curl
          run: |
            set -ex
            pwd
            ls -lah
            whoami
            env
            freebsd-version
            SYSDEP_ASSUME_YES=ON ./scripts/install-deps.sh
            # rustup installs into ~/.cargo of this one shell session's user, so PATH is extended here.
            ./scripts/install-rust-wasm.sh
            export PATH="$HOME/.cargo/bin:$PATH"
            cmake -S . -B build -DCONTOUR_TESTING=ON -DLIBUNICODE_USE_STD_SIMD=OFF
            cmake --build build/ -j2
            # ctest, not a hand-written list: that list predated src/coro, src/net, src/vthost and
            # src/vtworkspace, so those suites were built in this VM and thrown away -- and a BSD
            # is exactly where the daemon's socket code would diverge. The label exclusions keep
            # the VM's budget: `e2e` boots the real app repeatedly, and `lint` re-runs gates the
            # Linux jobs already own.
            #
            # contour_gui_test is excluded BY NAME, not because it cannot work here -- it selects
            # the offscreen QPA itself when there is no DISPLAY -- but because it has never once
            # run on this VM, and this job gates master rather than a PR. Widening coverage to the
            # daemon suites should not also stake master on an untried Qt run. Drop the exclusion
            # once someone has watched it pass here.
            ctest --test-dir build/ --output-on-failure -LE "e2e|lint" -E "contour_gui_test"
            rm -rf _deps build
  # }}}
  # {{{ OpenBSD
  openbsd:
    if: false #github.ref == 'refs/heads/master' || github.head_ref == 'release'
    runs-on: ubuntu-latest
    name: OpenBSD 7.5
    # env:
    #   MYTOKEN: "value1"
    #   MYTOKEN2: "value2"
    steps:
      - uses: actions/checkout@v4
      - name: Test in OpenBSD
        id: test
        uses: vmactions/openbsd-vm@v1
        timeout-minutes: 60
        with:
          envs: 'MYTOKEN MYTOKEN2'
          usesh: true
          copyback: false
          prepare: pkg_add -DI wget
          run: |
            set -ex
            pwd
            ls -lah
            whoami
            env
            ./scripts/install-deps.sh
            mkdir build
            # CONTOUR_EXTENSIONS_BUNDLED=OFF: rustup has no OpenBSD host toolchain, and OpenBSD's own rust
            # package carries no wasm32-wasip1 standard library, so the bundled extensions cannot be built.
            cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -D CMAKE_CXX_FLAGS=-I/home/runner/work/contour/contour/_deps/sources/yaml-cpp-0.8.0/include -DCONTOUR_TESTING=ON -DLIBUNICODE_USE_STD_SIMD=OFF -DCONTOUR_EXTENSIONS_BUNDLED=OFF
            cmake --build build/ -j2
            ./build/src/crispy/crispy_test
            ./build/src/vtparser/vtparser_test
            ./build/src/vtbackend/vtbackend_test
            ./build/src/vtrasterizer/vtrasterizer_test
            rm -rf _deps build
  # }}}
  # {{{ macOS
  macOSArm:
    # Pinned, not macos-latest, so the toolchain and SDK behind a release are reproducible
    # and a GitHub image rotation cannot silently change what ships.
    #
    # The minimum macOS of the .dmg no longer depends on this: the libraries Contour links
    # are built from source by vcpkg against CMAKE_OSX_DEPLOYMENT_TARGET (13.3), not taken
    # from the runner's Homebrew bottles. CONTOUR_MACOS_MIN_SUPPORTED enforces that.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: set variables
        id: set_vars
        run: |
          ./scripts/ci-set-vars.sh
          # Signing is gated on whether the secrets are actually reachable, not on the
          # branch name. GitHub withholds secrets from fork pull requests, which is the
          # real precondition; a branch-name test only approximates it, and approximated
          # it badly in both directions -- fork PRs still asked codesign for a Developer ID
          # that was in no keychain (breaking every PR run of this job), while a release
          # branch's signing path went completely unexercised until it was already on
          # master. Signing has to be proven before the merge, not after it.
          # (An ordinary pull request no longer packages or signs at all; the merge queue and the
          # release branch, which carry the secrets, prove it before it ships.)
          if [[ -n "$HAS_SIGNING_SECRETS" ]]; then
            echo "CODE_SIGN_CERTIFICATE_ID=Developer ID Application: Christian Parpart (6T525MU9UR)" >> "$GITHUB_OUTPUT"
            echo "NOTARIZE=ON" >> "$GITHUB_OUTPUT"
          else
            echo "CODE_SIGN_CERTIFICATE_ID=-" >> "$GITHUB_OUTPUT"
            echo "NOTARIZE=OFF" >> "$GITHUB_OUTPUT"
          fi
          # Stapled together with the image, never separately. A ticket on the .dmg alone
          # covers the download, but the app dragged out of it carries none -- so its first
          # launch depends on Gatekeeper reaching Apple, and a user who is offline, behind a
          # captive portal or on a restricted network gets exactly the dialog this pipeline
          # exists to prevent: "Apple could not verify ... is free of malware". Stapling the
          # app makes the installed copy self-sufficient. It costs a second Apple round trip
          # of a minute or two, which is not a price worth haggling over against that.
          if [[ -n "$HAS_SIGNING_SECRETS" ]]; then
            echo "STAPLE_APP=ON" >> "$GITHUB_OUTPUT"
          else
            echo "STAPLE_APP=OFF" >> "$GITHUB_OUTPUT"
          fi
          # Whether this run produces the .dmg at all (see PACKAGE_IMAGE below).
          echo "PACKAGE_IMAGE=$PACKAGE_IMAGE" >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          # Empty on fork pull requests, where GitHub withholds secrets. Only the
          # emptiness is observable here -- the value never reaches the log.
          #
          # Not even read on an ordinary pull request: nothing is signed there, so the secret is
          # never exposed to the job and the PR path is the same with or without secrets.
          HAS_SIGNING_SECRETS: ${{ (github.event_name != 'pull_request' || github.head_ref == 'release') && secrets.BUILD_CERTIFICATE_BASE64 || '' }}
          # A pull request builds and tests; it does not package, so it neither signs nor notarizes.
          PACKAGE_IMAGE: ${{ github.event_name != 'pull_request' || github.head_ref == 'release' }}
      - name: Install the Apple signing certificate
        if: steps.set_vars.outputs.NOTARIZE == 'ON'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # @see https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
          set -eu
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # -T grants codesign access to the imported key, and set-key-partition-list
          # records that grant in the key's ACL. Without both, codesign blocks on a GUI
          # confirmation prompt that never arrives on a runner, and the job hangs until
          # its timeout rather than reporting anything useful.
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 \
                          -k $KEYCHAIN_PATH -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                          -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          security find-identity -v -p codesigning $KEYCHAIN_PATH
      - name: Store the notarization credentials
        if: steps.set_vars.outputs.NOTARIZE == 'ON'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # An App Store Connect API key rather than an Apple ID and app-specific
          # password: it carries no personal account, can be scoped to the Developer
          # role, and is revocable on its own.
          set -eu
          KEY_PATH=$RUNNER_TEMP/notary-key.p8
          echo -n "$APPLE_API_KEY_P8" | base64 --decode -o $KEY_PATH
          xcrun notarytool store-credentials contour-notary \
                --key "$KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$KEY_PATH"
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-macosArm-r1
          max-size: 800M
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: Install Qt
        # The official Qt binaries, as on Linux and Windows -- not Homebrew's. Homebrew
        # splits Qt across ~40 per-module prefixes and macdeployqt only follows one of
        # them, so a brew-Qt bundle ships missing frameworks and unresolvable @rpath
        # references. That is the defect this job used to hand to users as a .dmg.
        #
        # Version pinned and the install attempted twice, both for the reasons documented at the
        # clang-tidy job's copy of this step. Pinned here too so every platform is measured against
        # one Qt, even though the corrupt archive is Linux AARCH64 only.
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          modules: qtmultimedia qt5compat qtshadertools qtspeech
          cache: true
      - name: Install Qt -- retry past a bad mirror
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          modules: qtmultimedia qt5compat qtshadertools qtspeech
          cache: true
      - name: "Install dependencies"
        # Sometimes, brew thinks it needs to install from source rather than binary,
        # so cap the runtime rather than burn CI credits on a source build.
        #
        # The libraries Contour links are NOT taken from Homebrew here -- see the vcpkg
        # steps below for why. install-deps.sh also brings the autotools that some vcpkg
        # ports need on the build host.
        timeout-minutes: 15
        run: |
          set -ex
          #brew update

          # Trying to work around some Github CI issues causing `brew install` to fail
          brew uninstall aws-sam-cli azure-cli

          ./scripts/install-deps.sh
      - name: "Cache vcpkg"
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
          key: vcpkg-macos-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-triplets/arm64-osx-contour.cmake') }}
          restore-keys: vcpkg-macos-
      - name: "vcpkg: clone and bootstrap"
        # The libraries Contour links (openssl, libssh2, yaml-cpp, freetype, harfbuzz,
        # cairo) are built from source against CMAKE_OSX_DEPLOYMENT_TARGET rather than
        # taken from Homebrew. Homebrew ships one prebuilt bottle per macOS release and
        # installs the one matching the runner, which made the .dmg's minimum macOS equal
        # to the runner image's -- an invisible compatibility cliff that moved whenever
        # GitHub rotated the image. vcpkg puts that floor under our control; the triplet at
        # cmake/vcpkg-triplets/arm64-osx-contour.cmake is where it is set.
        run: |
          set -ex
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: "install tmux (oracle for the tmux-interop tests)"
        # A CI-only tool, so it is here rather than in install-deps.sh, which lists what Contour
        # needs to BUILD. Without it the tmux oracles self-skip, and switching this job to
        # ctest (below) would otherwise have reached them only to watch them do nothing -- macOS
        # is where the BSD socket and Apple-libc++ differences in that code path would show up.
        #
        # Built from source at the same pinned 3.7b as the Linux matrix, rather than taken from the
        # formula. Both platforms then measure against the exact protocol version the control-mode
        # server claims to speak (docs/internals/vthost.md), and neither can start or stop running
        # the imsg oracle because a formula moved.
        run: |
          set -ex
          # tmux's configure hard-errors without libevent; ncurses comes with the SDK on macOS.
          # PKG_CONFIG_PATH is stated rather than assumed: the formula is not keg-only today, so its
          # .pc file is normally on the default search path anyway -- but naming the prefix keeps
          # this working if that ever changes, and costs nothing while it has not.
          brew install libevent
          export PKG_CONFIG_PATH="$(brew --prefix libevent)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          curl -sSL -o "$RUNNER_TEMP/tmux.tar.gz" \
            https://github.com/tmux/tmux/releases/download/3.7b/tmux-3.7b.tar.gz
          tar xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          # The release tarball ships a generated configure, so no autotools are needed here.
          # --disable-utf8proc is required, not merely a choice: 3.7b's configure hard-errors
          # ("must give --enable-utf8proc or --disable-utf8proc") rather than defaulting, and this
          # oracle only has to speak the control-mode protocol -- how tmux measures east-Asian
          # width does not enter into it. Stated on both platforms so they build the same binary.
          cd "$RUNNER_TEMP/tmux-3.7b" \
            && ./configure --disable-utf8proc \
            && make -j"$(sysctl -n hw.ncpu)" \
            && sudo make install
          tmux -V
      - name: "install fish, the one shell the shell-integration tests drive that macOS lacks"
        # contour_test runs each bundled integration script in its own shell on a real PTY, and SKIPs a
        # shell that is not installed. macOS brings bash (/bin/bash, 3.2.57), zsh and tcsh, and the runner
        # image PowerShell (actions/runner-images' macos-15-arm64-Readme.md); fish it does not.
        #
        # Pinned, as tmux is: Homebrew installs whatever its formula moved to, and the fish version
        # decides which marks the script sends itself. fish's own release package, checked against its
        # SHA-256, installs a universal binary into /usr/local/bin.
        run: |
          set -ex
          curl -sSL -o "$RUNNER_TEMP/fish.pkg" \
            https://github.com/fish-shell/fish-shell/releases/download/4.2.1/fish-4.2.1.pkg
          echo "07630a79598eb52ec42d54f458c99c9e2ebd39e525342ce3b354d338ef716965  $RUNNER_TEMP/fish.pkg" \
            | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/fish.pkg" -target /
          fish --version
          bash --version
          zsh --version
          tcsh --version
          pwsh --version
      # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
      # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
      - name: "install Rust (wasm32-wasip1)"
        run: ./scripts/install-rust-wasm.sh
      - name: "Generate build files"
        run: |
          # The `macos-package` preset IS the definition of a shippable macOS build --
          # Qt prefix, deployment target, warning policy, what lands in the bundle. This
          # job overrides only the two things a preset cannot know: which identity is
          # available in this run's keychain, and whether notarization secrets exist.
          # Everything else must come from the preset, or the .dmg users download would
          # again be built by a configuration nothing else exercises.
          #
          # QT_ROOT_DIR is exported by install-qt-action and is what the preset's
          # CMAKE_PREFIX_PATH reads.
          # The preset carries CONTOUR_MACOS_MIN_SUPPORTED=13.3, and it is enforced: if the
          # bundled dylibs demand anything newer, the package step fails rather than
          # shipping a .dmg that cannot launch. Configuring also triggers the vcpkg
          # manifest install, which builds those dylibs against that same target.
          #
          # Attempted twice. Configuring is where the vcpkg manifest install runs, and that builds
          # its dependencies from source, so this step's success depends on hosts nobody here
          # controls being up: it has failed repeatedly on 502/503/504 from
          # gitlab.freedesktop.org (cairo, fontconfig) and once on a 404 from ftpmirror.gnu.org.
          # vcpkg already retries an individual download three times; what it cannot retry is the
          # whole install once a port has given up. None of it is a verdict on the commit under
          # test, and this job is a required check, so a single bad minute upstream otherwise
          # blocks every pull request. Only a repeated failure fails the job.
          configure() {
            cmake --preset macos-package \
                  -DCODE_SIGN_CERTIFICATE_ID="${{ steps.set_vars.outputs.CODE_SIGN_CERTIFICATE_ID }}" \
                  -DCONTOUR_MACOS_NOTARIZE="${{ steps.set_vars.outputs.NOTARIZE }}" \
                  -DCONTOUR_MACOS_STAPLE_APP="${{ steps.set_vars.outputs.STAPLE_APP }}"
          }
          configure || {
            echo "::warning::configure failed (typically an upstream source download); retrying once"
            sleep 30
            configure
          }
      - name: "Build"
        run: cmake --build --preset macos-package
      - name: "tests"
        # ctest, not a hand-written list of binaries: the previous four-line list predated
        # src/coro, src/net, src/vthost and src/vtworkspace, so those suites were built here and
        # never run — macOS is exactly where the Apple-libc++ and BSD-socket differences bite.
        # Registering a new test target must not require editing this file.
        #
        # 15 rather than 10: with tmux installed the four oracles now actually run instead of
        # skipping, and each drives a real tmux server over a pty. 30 rather than 15: the GUI suite
        # runs once per Quick Controls style (Fusion, Fluent, ContourLinux, ContourTui), each 4-7 minutes
        # on this runner, and the fourth was cut off at 15 with every earlier test passing.
        #
        # A hang fails one test, not the step: the preset gives every test 10 minutes (the longest GUI
        # run takes 7), vthost_test its own 5, and ctest shows a timed-out test's output. The trace
        # names each Catch2 case on stderr as it starts, so that output ends with the case that hung.
        timeout-minutes: 30
        env:
          CONTOUR_TEST_TRACE: "1"
        run: ctest --preset macos-package -j "$(sysctl -n hw.ncpu)"
      - name: "verify the tmux oracles actually ran"
        # @see the identical assertion on the Linux matrix for why a green suite is not enough:
        # a Catch2 SKIP exits 0, so "no tmux, nothing ran" is indistinguishable from success.
        # Nothing is excluded, for parity with Linux: this job pins the same tmux 3.7b, so the imsg
        # oracle runs here too rather than being carved out by name. Pinning is what makes that safe
        # -- the version is stated in the workflow, not inherited from whatever a formula moved to.
        run: |
          set -o pipefail
          binary=out/macos-package/src/vthost/vthost_test
          output=$("$binary" '[oracle]' 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::$binary reported SKIPPED; the tmux interop tests are not being exercised on macOS"
            exit 1
          fi
      - name: "verify the shell-integration tests actually ran"
        # @see the identical assertion on the Linux matrix: a Catch2 SKIP exits 0. macOS is where Apple's
        # bash 3.2 and tcsh, with BSD awk and sed, run the scripts, and PowerShell runs on macOS.
        run: |
          set -o pipefail
          binary=out/macos-package/src/contour/contour_test
          # ShellIntegrationShells.profileLine runs the line the one-click install writes, which asks the
          # contour binary for the script: outside ctest, it learns that binary here, and SKIPs without it.
          # That binary links Qt, and a runner has no display for it, as the AppImage smoke test knows.
          export QT_QPA_PLATFORM=offscreen
          export CONTOUR_BINARY="$PWD/out/macos-package/src/contour/contour.app/Contents/MacOS/contour"
          [ -x "$CONTOUR_BINARY" ] || { echo "::error::$CONTOUR_BINARY not found; profileLine would skip"; exit 1; }
          output=$("$binary" '[shells]' 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::$binary [shells] reported SKIPPED; a shell the integration scripts target is not being exercised on macOS"
            exit 1
          fi
      - name: "verify the macOS menu bar's key seam on the cocoa platform"
        # The ctest above runs contour_gui_test offscreen, where every [display] case SKIPs: the menu bar
        # needs Qt Widgets on the cocoa plugin, so the chords the terminal leaves to the menu (Cmd-Q, Cmd-,,
        # Cmd-M, Cmd-H) and what AppKit does with them reach no assertion there. The runner has a
        # logged-in Aqua session, so this runs them on the real platform. Gating, and checked for SKIPs
        # like the steps above: a Catch2 SKIP exits 0.
        run: |
          set -o pipefail
          binary=out/macos-package/src/contour/contour_gui_test
          output=$(CONTOUR_TEST_DISPLAY=1 "$binary" '[shortcutoverride],[menubar]' 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::$binary [shortcutoverride],[menubar] reported SKIPPED; the menu bar's key seam is not being exercised on macOS"
            exit 1
          fi
      - name: "Create Package(s)"
        if: steps.set_vars.outputs.PACKAGE_IMAGE == 'true'
        # cpack deploys, prunes unloadable plugins, verifies the bundle is self-contained,
        # signs it inside-out, notarizes and staples both the app and the image. Each of
        # those steps is fatal on failure now, so a broken bundle stops here instead of
        # being uploaded. Notarization waits on Apple, hence the generous timeout.
        timeout-minutes: 30
        run: |
          set -ex
          echo killing...; sudo pkill -9 XProtect >/dev/null || true; # see https://github.com/actions/runner-images/issues/7522
          echo waiting...; while pgrep XProtect; do sleep 3; done;
          # Attempted twice. CPack's DragNDrop generator mounts a temporary image and detaches it
          # again, and the detach loses a race against whatever is still walking the volume --
          # Spotlight's indexer, or XProtect rescanning the freshly written bundle. CPack reports it
          # as:
          #     CPack Error: Error executing: /usr/bin/hdiutil detach "/Volumes/Contour"
          #     CPack Error: Error detaching temporary disk image.
          # which has cost this job several runs. The killing of XProtect above is the same class of
          # workaround and does not cover it, because the rescan can start after that wait.
          #
          # Before retrying, force-detach anything still mounted: a leftover /Volumes/Contour would
          # otherwise make the second attempt fail for a different reason, mounting as
          # "Contour 1" and defeating the fixed path the mv below expects.
          package() { cpack --preset macos-package --verbose; }
          package || {
            echo "::warning::cpack failed (typically the hdiutil detach race); retrying once"
            hdiutil detach "/Volumes/Contour" -force || true
            sudo pkill -9 XProtect >/dev/null || true
            while pgrep XProtect; do sleep 3; done
            sleep 10
            package
          }
          BASENAME="contour-${{ steps.set_vars.outputs.VERSION_STRING }}-macOS-arm"
          mv -vf "out/macos-package/Contour-${{ steps.set_vars.outputs.VERSION_STRING }}-Darwin.dmg" "${BASENAME}.dmg"
          echo "DMG=${BASENAME}.dmg" >> "$GITHUB_ENV"
      - name: "verify the DMG is something a user can actually open"
        if: steps.set_vars.outputs.PACKAGE_IMAGE == 'true'
        # The assertion that was missing all along: a green package step used to mean only
        # that hdiutil succeeded.
        #
        # Scoped to what cpack could not already check. The image's own signature, its
        # staple and `spctl --type install` are asserted fatally inside the packaging run
        # (macos-bundle.py sign/notarize and cmake/MacOSSignDmg.cmake), and the .dmg here
        # is the byte-identical file cpack produced -- only `mv`'d. What is genuinely new
        # is the app *as mounted from the image*, a different object from the staged
        # bundle that was signed.
        run: |
          set -ex
          MOUNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          trap 'hdiutil detach "$MOUNT" || true' EXIT

          codesign --verify --deep --strict --verbose=4 "$MOUNT/contour.app"

          # The image ships the app and nothing else -- plus the /Applications symlink the
          # DragNDrop generator adds for drag-installing. CONTOUR_INSTALL_TOOLS=OFF in the
          # preset is what keeps bench-headless out of Contents/MacOS; assert it, because
          # the day someone flips that option back on, the only visible symptom would be a
          # developer benchmark tool shipping inside a user-facing release.
          test "$(ls "$MOUNT" | sort | tr '\n' ' ')" = "Applications contour.app "
          test "$(ls "$MOUNT/contour.app/Contents/MacOS")" = "contour"
          # ...and the bundled status-line extensions, where the app looks for them.
          for extension in agent-status clock git plasma sysload; do
            test -f "$MOUNT/contour.app/Contents/Resources/extensions/$extension.wasm"
          done

          if [[ "${{ steps.set_vars.outputs.NOTARIZE }}" != 'ON' ]]; then
            echo "::notice::unsigned build (no secrets); skipping Gatekeeper assertions"
            exit 0
          fi

          # Reproduce what the user actually does, because that is where the
          # "Apple could not verify ... is free of malware" dialog comes from: they drag
          # the app OUT of the image and launch the copy. A ticket stapled only to the
          # .dmg does not travel with that copy, leaving first launch dependent on
          # Gatekeeper reaching Apple -- which fails offline, behind a captive portal, or
          # on a restricted network. So the checks below run against the copy, not against
          # the app sitting on the mounted image.
          INSTALLED=$(mktemp -d)/contour.app
          ditto "$MOUNT/contour.app" "$INSTALLED"
          # A downloaded image carries this; the copy must clear Gatekeeper with it set.
          xattr -w com.apple.quarantine "0081;00000000;Safari;" "$INSTALLED"

          # stapler asks Apple's CloudKit for the ticket record, and a dropped connection there
          # fails the step with error 68 although nothing is wrong with the ticket; retry that
          # (and only that) before failing.
          staple_check() {
            for attempt in 1 2 3; do
              xcrun stapler validate "$1" && return 0
              sleep $((attempt * 10))
            done
            return 1
          }

          # The ticket is embedded in the copy, so first launch needs no network at all.
          staple_check "$INSTALLED"
          # The exact decision Gatekeeper makes when that copy is first launched.
          spctl --assess --verbose=4 --type exec "$INSTALLED"

          # And the same for the image a browser just downloaded.
          staple_check "$DMG"
          spctl --assess --verbose=4 --type install "$DMG"
      - name: upload to artifact store (DMG)
        if: steps.set_vars.outputs.PACKAGE_IMAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-macOS-arm.dmg"
          path: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-macOS-arm.dmg"
          retention-days: 7
  # }}}
  # {{{ Windows
  windows:
    name: "Windows"
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    env:
      CMAKE_PRESET: "msvc-release"
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
    steps:
      - uses: actions/checkout@v4
      # ccache, not sccache: cmake/CompileCache.cmake picks the ccache on PATH, and with it forces
      # /Z7 (debug info inside the .obj) in place of /Zi, which no launcher can cache. The action
      # installs ccache 4.9 and sets compiler_check=content on Windows, where the compiler's mtime
      # follows the image's install time. The statistics step at the end names the binary CMake used
      # and the cache directory it read, so a mismatch with the restored one shows in the log.
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-windows-msvc-release
          max-size: 1500M
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: setup environment
        shell: powershell
        id: set_vars
        run: .\scripts\ci-set-vars.ps1
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: "Fetch embedded dependencies"
        shell: powershell
        run: |
          ./scripts/install-deps.ps1 --skip-vcpkg
          type ./_deps/sources/CMakeLists.txt
      - name: Install Qt
        # Attempted twice, for the bad-mirror failure documented at the clang-tidy job's copy of
        # this step; only a repeated failure fails the job.
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          # 6.10, not the 6.11 the other platforms pin: Qt restructured its Windows package
          # repository at 6.11 into per-architecture subdirectories
          # (qt6_6111/qt6_6111_msvc2022_64/Updates.xml) where every release up to 6.10 kept a flat
          # one (qt6_6103/Updates.xml). aqtinstall still requests the flat path, so a 6.11 install
          # here dies with "Failed to locate XML data for Qt version '6.11.1'". 3.3.0 is its latest
          # release, so there is nothing newer to move to; Linux and macOS are unaffected because
          # their repositories stayed flat.
          #
          # 6.10 carries all four modules below, so this costs no feature -- only the configure-time
          # notice that the detected Qt is older than the version Contour is tested against. Raise
          # this to "6.11.*" once aqtinstall learns the new layout.
          version: "6.10.*"
          #version: "5.15.*"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: Install Qt -- retry past a bad mirror
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: "Setup NuGet for vcpkg caching"
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name GitHub \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
      - name: "Cache vcpkg"
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ runner.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      - name: "Upgrade NuGet"
        run: |
          choco upgrade nuget.commandline -y
      - name: "vcpkg: Clone and bootstrap"
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}\vcpkg
          ${{ runner.workspace }}\vcpkg\bootstrap-vcpkg.bat
          ${{ runner.workspace }}\vcpkg\vcpkg.exe fetch nuget
        env:
          VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
      - name: "vcpkg: Install dependencies"
        shell: pwsh
        run: |
          ${{ runner.workspace }}\vcpkg\vcpkg.exe install --triplet x64-windows
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
          VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
      - name: "Install cmake"
        uses: lukka/get-cmake@v3.29.0
      - name: "Check cmake version"
        run: cmake --version
      - uses: ilammy/msvc-dev-cmd@v1
      - name: "install Rust (wasm32-wasip1)"
        # @see the same step on Linux: the bundled extensions and the test guests are Rust.
        shell: bash
        run: ./scripts/install-rust-wasm.sh
      - name: "Generate build files"
        shell: pwsh
        run: |
          cmake --preset ${{ env.CMAKE_PRESET }}
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
      - name: "Build"
        shell: pwsh
        run: |
          cmake --build --preset ${{ env.CMAKE_PRESET }}
      - name: "Show ccache statistics"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          (Get-Command ccache).Source
          ccache --version
          ccache --show-config | Select-String -Pattern 'cache_dir|max_size|compiler_check|sloppiness|base_dir'
          ccache -s
      - name: "Test"
        shell: pwsh
        run: |
          ctest --preset ${{ env.CMAKE_PRESET }} --build-config RelWithDebInfo -j $env:NUMBER_OF_PROCESSORS
      - name: "verify the AF_UNIX tests actually ran"
        # Windows is the ONLY validation the daemon's Windows transport gets -- nobody develops it
        # on a Windows box. The AF_UNIX cases self-skip where the platform has no AF_UNIX, and a
        # Catch2 SKIP exits 0, so a green suite cannot distinguish "the transport works" from "it
        # was never exercised". `windows-latest` is far past the 10 1803 that introduced AF_UNIX,
        # so a skip here is a regression, not a platform fact. Same assertion the Linux matrix
        # makes about the tmux oracles. The transport itself is core-cpp's now (vendor/core-cpp), whose
        # own CI runs its AF_UNIX cases on Windows; vthost_test is what exercises it from here.
        #
        # On WIN32 the top-level CMakeLists redirects CMAKE_RUNTIME_OUTPUT_DIRECTORY to
        # <binaryDir>/bin, so the executables do NOT sit beside their source directory the way they
        # do on Linux. The preset's generator is Ninja (single-config), so there is no
        # per-configuration subdirectory under it either.
        #
        # Bounded, and streamed with CONTOUR_TEST_TRACE's case names: a case that hangs here would
        # otherwise hold the job until its own time limit and print nothing, its output still captured.
        # The skip check reads Catch2's summary, not the trace's case names.
        shell: bash
        timeout-minutes: 10
        env:
          CONTOUR_TEST_TRACE: "1"
        run: |
          set -o pipefail
          for binary in \
              "out/build/${CMAKE_PRESET}/bin/vthost_test.exe"; do
            # A missing binary must not read as "nothing skipped": that is the very failure mode
            # this step exists to catch, one directory layout further out.
            [ -x "$binary" ] || { echo "::error::$binary not found; the assertion below would pass vacuously"; exit 1; }
            echo "--- $binary [afunix]"
            log=$(mktemp)
            "$binary" '[afunix]' 2>&1 | tee "$log" || exit 1
            if grep -v '^\[trace\]' "$log" | grep -q 'skipped'; then
              echo "::error::$binary [afunix] reported SKIPPED; the daemon's AF_UNIX transport is not being exercised on Windows"
              exit 1
            fi
          done
      - name: "verify the PowerShell integration tests actually ran"
        # @see "verify the AF_UNIX tests actually ran": a Catch2 SKIP exits 0, and contour_test SKIPs
        # the PowerShell integration's cases where no pwsh is on PATH. windows-latest carries
        # PowerShell 7 (per actions/runner-images' Windows2025-VS2026-Readme.md), so a skip here is a
        # regression -- and Windows is where the script's OSC 133 has to pass through ConPTY. Each case
        # runs under Windows PowerShell 5.1 too, which every Windows ships, PSReadLine 2.0 and all. Only
        # [pwsh]: contour_test does not run the POSIX shells on Windows at all.
        #
        # ShellIntegrationShells.profileLine runs the very line the one-click install appends to a profile,
        # which asks contour.exe for the script through a pipe: RelWithDebInfo builds the GUI-subsystem
        # contour.exe a user installs, so this is where that pipe is proved. Run outside ctest, it learns
        # the binary from CONTOUR_BINARY here, and SKIPs -- failing this step -- without it.
        shell: pwsh
        timeout-minutes: 10
        run: |
          $binary = "out/build/$env:CMAKE_PRESET/bin/contour_test.exe"
          $contour = "out/build/$env:CMAKE_PRESET/bin/contour.exe"
          # A missing binary must not read as "nothing skipped".
          foreach ($required in $binary, $contour) {
            if (-not (Test-Path $required)) {
              Write-Output "::error::$required not found; the assertion below would pass vacuously"
              exit 1
            }
          }
          $env:CONTOUR_BINARY = (Resolve-Path $contour).Path
          Write-Output "--- $binary [pwsh]"
          $output = & $binary '[pwsh]' 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Output $output
          # Before the exit status: Catch2 exits non-zero when every case skipped, which is exactly what
          # a missing pwsh looks like.
          if ($output -match 'skipped') {
            Write-Output "::error::$binary [pwsh] reported SKIPPED; the PowerShell integration is not being exercised on Windows"
            exit 1
          }
          if ($status -ne 0) { exit 1 }
      - name: "verify the Win32 chrome tests actually ran"
        # @see "verify the PowerShell integration tests actually ran": the [win32] cases SKIP off the native
        # Windows platform, and a SKIP exits 0, so a run that never reached the native plugin would read as a
        # pass. windows-latest has a desktop, so a skip here is a regression. The [win11-22h2] cases are left
        # out: they SKIP on a Windows older than 22H2 (a pinned runner image), which is no regression.
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          QT_QUICK_BACKEND: software
          CONTOUR_TEST_DISPLAY: "1"
        run: |
          $binary = "out/build/$env:CMAKE_PRESET/bin/contour_gui_test.exe"
          # A missing binary must not read as "nothing skipped".
          if (-not (Test-Path $binary)) {
            Write-Output "::error::$binary not found; the assertion below would pass vacuously"
            exit 1
          }
          Write-Output "--- $binary [win32]~[win11-22h2]"
          $output = & $binary '[win32]~[win11-22h2]' 2>&1 | Out-String
          $status = $LASTEXITCODE
          Write-Output $output
          if ($output -match 'skipped') {
            Write-Output "::error::$binary [win32] reported SKIPPED; the Win32 chrome is not being exercised on Windows"
            exit 1
          }
          if ($status -ne 0) { exit 1 }
      # Pull requests build and test; packaging (WiX, zip, their checks and uploads) runs on master, the merge
      # queue and the `release` branch.
      - name: "Install Wix Toolset"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        run: |
          # Use this to list all available versions
          # dotnet tool search --global wix --detail
          # or at URL: https://www.nuget.org/packages/wix#versions-body-tab
          dotnet tool install --global wix --version 4.0.6
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
      - name: "Create Package(s)"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        shell: powershell
        run: |
          cpack --preset ${{ env.CMAKE_PRESET }} -V
          if ($LASTEXITCODE -ne 0) {
            echo "CPack failed. Dumping wix.log..."
            type "out/build/${{ env.CMAKE_PRESET }}/_CPack_Packages/win64/WIX/wix.log"
            exit $LASTEXITCODE
          }
      - name: "Rename package(s)"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        run: |
          mv "out\build\${{ env.CMAKE_PRESET }}\Contour-${{ steps.set_vars.outputs.version }}-win64.msi" "contour-${{ steps.set_vars.outputs.version }}-win64.msi"
          mv "out\build\${{ env.CMAKE_PRESET }}\Contour-${{ steps.set_vars.outputs.version }}-win64.zip" "contour-${{ steps.set_vars.outputs.version }}-win64.zip"
      - name: "Check the package contents"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        # What the package must and must not hold, asserted as the macOS job does for its image: a mistake
        # either way has no other visible symptom.
        # - No executable but those allowed, no .ilk or .pdb, no Qt Test: bin/ is every target's output
        #   directory (see its install rule in src/contour/CMakeLists.txt for why that matters), and
        #   CONTOUR_INSTALL_TOOLS=OFF in the Windows preset keeps the tools' own install rules out.
        # - What is loaded by name or file type at run time, which no build notices missing and CI's tests
        #   find anyway, in the Qt install QT_PLUGIN_PATH names: the Fluent row's controls style, named through
        #   QQuickStyle::setStyle where windeployqt's --qmldir scan cannot see it; Qt SVG and its image plugin
        #   (see cmake/DeployQt.cmake); and the bundled status-line extensions, which contour.exe looks for
        #   beside bin/.
        # contour.exe must be found first, or every check would pass on a zip it cannot read.
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("contour-${{ steps.set_vars.outputs.version }}-win64.zip")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
          } finally {
            $zip.Dispose()
          }
          if (-not ($entries | Where-Object { $_ -like '*/contour.exe' -or $_ -eq 'contour.exe' })) {
            Write-Host "::error::the zip holds no contour.exe; the checks below would pass vacuously"
            exit 1
          }
          $shippedExecutables = 'contour.exe', 'OpenConsole.exe'
          $strays = $entries | Where-Object {
            $name = ($_ -split '/')[-1]
            ($name -like '*.exe' -and $shippedExecutables -notcontains $name) -or $name -like '*.ilk' -or
              $name -like '*.pdb' -or $name -eq 'Qt6Test.dll' -or $name -eq 'qoffscreen.dll'
          }
          if ($strays) {
            Write-Host "::error::the zip ships $($strays -join ', ')"
            exit 1
          }
          $required = @(
            'bin/qml/QtQuick/Controls/FluentWinUI3/qmldir'
            'bin/imageformats/qsvg.dll'
            'bin/Qt6Svg.dll'
          ) + ('agent-status', 'clock', 'git', 'plasma', 'sysload' | ForEach-Object { "share/contour/extensions/$_.wasm" })
          foreach ($path in $required) {
            if (-not ($entries | Where-Object { $_ -like "*/$path" -or $_ -eq $path })) {
              Write-Host "::error::the zip holds no $path"
              exit 1
            }
          }
      - name: "Uploading MSI to artifact store"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.version }}-win64.msi"
          path: "contour-${{ steps.set_vars.outputs.version }}-win64.msi"
          if-no-files-found: error
          retention-days: 7
      - name: "Uploading ZIP to artifact store"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.version }}-win64.zip"
          path: "contour-${{ steps.set_vars.outputs.version }}-win64.zip"
          if-no-files-found: error
          retention-days: 7
      - name: "Check that the MSI upgrades in place"
        if: github.event_name != 'pull_request' || github.head_ref == 'release'
        # Installs the package over an earlier build of the same release, and over the latest release, as an
        # installed Contour is upgraded in the field. The two builds of one release differ only in the fourth
        # version field (the run number), which Windows Installer ignores: only a ProductCode of its own per
        # build lets the second one in (error 1638 otherwise). Needs a runner without Contour installed, which
        # scripts/check-msi-upgrade.ps1 insists on.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.set_vars.outputs.version }}'
          $candidate = "contour-$version-win64.msi"
          $release = ($version -split '\.')[0..2] -join '.'

          # cpack changes into the preset's build directory before it resolves -B, so the directory is absolute.
          $earlierDir = Join-Path $PWD 'out\msi-earlier'
          cpack --preset ${{ env.CMAKE_PRESET }} -G WIX -D CPACK_PACKAGE_VERSION=$release.0 -B $earlierDir
          if ($LASTEXITCODE -ne 0) {
            Write-Host "CPack failed. Dumping wix.log..."
            Get-Content (Join-Path $earlierDir '_CPack_Packages\win64\WIX\wix.log') -ErrorAction SilentlyContinue
            exit $LASTEXITCODE
          }
          $earlier = @(Get-ChildItem $earlierDir -Filter '*-win64.msi')
          if ($earlier.Count -ne 1) {
            Write-Host "::error::expected one earlier build of $release in $earlierDir, found $($earlier.Count)"
            exit 1
          }

          gh release download --repo contour-terminal/contour --pattern '*-win64.msi' --dir out\msi-release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $released = @(Get-ChildItem out\msi-release -Filter '*-win64.msi' -ErrorAction SilentlyContinue)
          if ($released.Count -ne 1) {
            Write-Host "::error::expected one *-win64.msi in the latest release, found $($released.Count)"
            exit 1
          }

          pwsh scripts\check-msi-upgrade.ps1 -From $earlier[0].FullName -To $candidate -LogDir "$env:RUNNER_TEMP\msi-same-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh scripts\check-msi-upgrade.ps1 -From $released[0].FullName -To $candidate -LogDir "$env:RUNNER_TEMP\msi-from-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: "Uploading the upgrade check's logs"
        if: failure() && (github.event_name != 'pull_request' || github.head_ref == 'release')
        uses: actions/upload-artifact@v4
        with:
          name: "msi-upgrade-check-logs"
          path: ${{ runner.temp }}/msi-*
          if-no-files-found: ignore
          retention-days: 7
  # }}}
  # {{{ Ubuntu 24.04 CC matrix
  ubuntu_2404_cc_matrix:
    strategy:
      fail-fast: false
      matrix:
        # Chosen by event, as data: a pull request builds one leg -- Clang 22 on x86, the compiler
        # that also gates -Werror -- while master, the merge queue and the `release` pull request
        # build all four. `werror` is OFF only where the leg is not known to build clean with it
        # (GCC: a local GCC 16 build stops on -Werror=bidi-chars; GCC 15 is unverified). `artifacts`
        # marks the single leg that runs the chrome snapshots and uploads the test binaries: the GCC
        # x86 leg on master, where valgrind/conformance/bench consume them, the Clang x86 leg on pull
        # requests, which have no consumers but keep the steps exercised.
        # The arm Clang leg is OFF too: it runs on master only, so nothing proves it builds clean with
        # -Werror before merge, whereas the x86 Clang leg is proven by every pull request.
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.head_ref != 'release' && '[{"runner":"ubuntu-24.04","compiler":"Clang 22","cxx":23,"build_type":"RelWithDebInfo","qt_version":6,"werror":"ON","artifacts":true}]' || '[{"runner":"ubuntu-24.04","compiler":"GCC 15","cxx":23,"build_type":"RelWithDebInfo","qt_version":6,"werror":"OFF","artifacts":true},{"runner":"ubuntu-24.04-arm","compiler":"GCC 15","cxx":23,"build_type":"RelWithDebInfo","qt_version":6,"werror":"OFF","artifacts":false},{"runner":"ubuntu-24.04","compiler":"Clang 22","cxx":23,"build_type":"RelWithDebInfo","qt_version":6,"werror":"ON","artifacts":false},{"runner":"ubuntu-24.04-arm","compiler":"Clang 22","cxx":23,"build_type":"RelWithDebInfo","qt_version":6,"werror":"OFF","artifacts":false}]') }}
    name: "${{ matrix.runner }} (${{ matrix.compiler }}, C++${{ matrix.cxx }}, Qt${{ matrix.qt_version }})"
    runs-on: ${{ matrix.runner }}
    env:
      # PyYAML is pip-installed below; see scripts/check-workflows.py.
      CHECK_WORKFLOWS_REQUIRE_YAML: 1
    outputs:
      id: "${{ matrix.runner }} ${{ matrix.compiler }} (C++${{ matrix.cxx }}, ${{ matrix.build_type }}, ${{ matrix.qt_version }})"
    steps:
      - uses: actions/checkout@v4
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "ccache-${{ matrix.runner }}-${{ matrix.compiler }}-${{ matrix.cxx }}-${{ matrix.build_type }}-${{ matrix.qt_version  }}"
          max-size: ${{ startsWith(matrix.compiler, 'GCC') && '1200M' || '700M' }}
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars
        run: sudo apt -qy install libxml2-utils
      - name: set environment variables
        id: set_vars
        run: ./scripts/ci-set-vars.sh
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: "Set up output var: CC_VERSION"
        id: extract_matrix
        run: |
          CC_VERSION=$( echo "${{ matrix.compiler }}" | awk '{ print $2; }')
          echo "CC_VERSION=${CC_VERSION}" >> "$GITHUB_OUTPUT"
      - name: "Set up QTVER var"
        id: set_qtver
        run: |
          if [[ ${{ matrix.qt_version }} = "5" ]]; then
            echo "QTVER=5" >> "$GITHUB_OUTPUT"
          else
            echo "QTVER=6" >> "$GITHUB_OUTPUT"
          fi
      - name: "install dependencies"
        run: sudo env QTVER="${{ matrix.qt_version }}" SYSDEP_ASSUME_YES=ON ./scripts/install-deps.sh
      - name: "install tmux (oracle for the tmux-interop tests)"
        # Without a tmux binary the tmux-compatibility tests self-skip, which is how they went
        # their entire existence without once running: LayoutString's two select-layout oracles,
        # TmuxGateway's real `tmux -C` drive, and TmuxController's GUI mirror. They are the only
        # coverage `vthost/tmux/ControlModeSpawn.cpp` gets at all.
        #
        # Built from source rather than installed from the distro, because Ubuntu 24.04 ships tmux
        # 3.4 and ImsgServer's "a real tmux binary attaches over imsg" needs the rewritten imsg
        # framing that landed after 3.5. With 3.4 that oracle self-skipped, and the verification step
        # below had to exclude it by name to keep the matrix green — so the one test covering the
        # imsg endpoint never ran anywhere.
        #
        # 3.7b is not an arbitrary "new enough": it is the version the control-mode server is pinned
        # to (see docs/internals/vthost.md), so the oracle now measures us against the exact protocol
        # we claim to speak.
        run: |
          set -ex
          # tmux's configure hard-errors without these two; the runner image carries neither the
          # libevent nor the ncurses development headers, only their runtimes.
          sudo apt -qy install libevent-dev libncurses-dev
          curl -sSL -o "$RUNNER_TEMP/tmux.tar.gz" \
            https://github.com/tmux/tmux/releases/download/3.7b/tmux-3.7b.tar.gz
          tar xzf "$RUNNER_TEMP/tmux.tar.gz" -C "$RUNNER_TEMP"
          # The release tarball ships a generated configure, so no autotools are needed here.
          # --disable-utf8proc: see the macOS job for why it must be stated rather than defaulted.
          # Passing it here too keeps both platforms measuring against the same tmux build.
          cd "$RUNNER_TEMP/tmux-3.7b" \
            && ./configure --disable-utf8proc \
            && make -j"$(nproc)" \
            && sudo make install
          tmux -V
      - name: "install the shells the shell-integration tests drive"
        # contour_test runs each bundled integration script in its own shell on a real PTY, and SKIPs
        # a shell that is not installed. bash and PowerShell come with both runner images (per
        # actions/runner-images' Ubuntu2404-Readme.md and Ubuntu2404-Arm64-Readme.md). The versions are
        # printed because they decide what is tested: the distro's fish 3.7 marks no prompts itself, so
        # its integration script sends every mark.
        run: |
          set -ex
          sudo apt -qy install zsh fish tcsh
          zsh --version
          fish --version
          tcsh --version
          pwsh --version
      - name: "Post-fix embedded dependency permissions."
        run: sudo find _deps/sources -exec chown $UID {} \;
      # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
      # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
      - name: "install Rust (wasm32-wasip1)"
        run: ./scripts/install-rust-wasm.sh
      # Ubuntu 24.04's distro Qt is 6.4.2, which does not provide the Qt6::GuiPrivate CMake package
      # the RHI renderer needs (rhi/qrhi.h). Install a modern Qt6 over it; install-qt-action prepends
      # its Qt to CMAKE_PREFIX_PATH via the Qt6_DIR/QT_ROOT_DIR env vars it exports, so find_package
      # resolves this one ahead of the distro package.
      #
      # Version pinned and the install attempted twice, both for the reasons documented at the
      # clang-tidy job's copy of this step. These are the jobs that forced it: both ubuntu-24.04-arm
      # matrix entries are exactly the AARCH64 install that 6.11.2's corrupt qttools archive breaks.
      - name: "Install Qt (GuiPrivate-capable)"
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: "Install Qt (GuiPrivate-capable) -- retry past a bad mirror"
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      # PyYAML lets check_workflows run its required-checks rule against the real workflow files;
      # CHECK_WORKFLOWS_REQUIRE_YAML (job env above) makes a missing PyYAML a failure, so a pull
      # request cannot pass with that rule silently skipped. It goes into the python3 that is on
      # PATH NOW, after the Qt action has put its own first: that is the one CMake finds at
      # configure time, and the distro's python3-yaml would only serve /usr/bin/python3.
      - name: Installing PyYAML for the workflow lint
        run: python3 -m pip install pyyaml
      # Ubuntu 24.04 packages GCC up to 14; newer releases come from the toolchain PPA, which
      # builds them for noble on amd64 and arm64.
      - name: Install GCC
        if: ${{ startsWith(matrix.compiler, 'GCC') }}
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo ./scripts/apt-update.sh
          sudo apt install -y g++-${{ steps.extract_matrix.outputs.CC_VERSION }}
      - name: Install Clang
        if: ${{ startsWith(matrix.compiler, 'Clang') }}
        env:
          CC_VERSION: ${{ steps.extract_matrix.outputs.CC_VERSION }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CC_VERSION"
          sudo apt install -y "clang-$CC_VERSION"
          sudo apt install -y "clang-tidy-$CC_VERSION"
      - name: "create build directory"
        run: mkdir build
      - name: CMake version
        run: cmake --version
      # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
      # unicode.org outage used to fail the configure step of every job at once.
      - name: "Unicode database"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _ucd
          key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
      - name: "cmake"
        run: |
          CC_NAME=$(echo "${{ matrix.compiler }}" | awk '{ print tolower($1); }')
          CC_VER=$( echo "${{ matrix.compiler }}" | awk '{ print $2; }')
          test "${{ matrix.compiler }}" = "GCC 8"  && EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DPEDANTIC_COMPILER_WERROR=ON"
          test "${CC_NAME}" = "gcc" && CC_EXE="g++"
          # AArch64 GCC + RelWithDebInfo debug info is what fills the runner; --no-keep-memory
          # tells ld to re-read symbol tables rather than hold them, trading time for RAM.
          #
          # The link cap below is spelled CONTOUR_LINK_JOBS and not CMAKE_JOB_POOL_LINK on
          # purpose: CMakeLists.txt sets CMAKE_JOB_POOL_LINK as a NORMAL variable, which shadows
          # a cache entry of the same name passed here -- so -DCMAKE_JOB_POOL_LINK=link defines a
          # pool nothing binds to, and rules.ninja still reads "contour_link_pool / depth = 2".
          test "${CC_NAME}" = "gcc" && CMAKE_EXE_LINKER_FLAGS="$CMAKE_EXE_LINKER_FLAGS -Wl,--no-keep-memory"
          if [[ "${CC_NAME}" = "clang" ]]; then
              CC_EXE="clang++"
              # CMAKE_CXX_FLAGS="-stdlib=libc++"
              # CMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"
              # EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DENABLE_TIDY=ON"
              # EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DPEDANTIC_COMPILER_WERROR=OFF"
          fi
          cmake \
              $EXTRA_CMAKE_FLAGS \
              -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
              -DCMAKE_CXX_STANDARD=${{ matrix.cxx }} \
              -DCMAKE_CXX_COMPILER="${CC_EXE}-${CC_VER}" \
              -DCMAKE_CXX_FLAGS="${CMAKE_CXX_FLAGS}" \
              -DCMAKE_EXE_LINKER_FLAGS="${CMAKE_EXE_LINKER_FLAGS}" \
              -DCMAKE_INSTALL_PREFIX="/usr" \
              -DCONTOUR_LINK_JOBS=1 \
              -DCONTOUR_WAYLAND=OFF \
              -DLIBUNICODE_UCD_BASE_DIR=$PWD/_ucd \
              -DPEDANTIC_COMPILER_WERROR=${{ matrix.werror }} \
              --preset gcc-debug
      - name: "build"
        # -j$(nproc) rather than a hardcoded -j3: a quarter of a 4-vCPU runner was sitting idle.
        #
        # The memory sampling is temporary. ubuntu-24.04-arm (GCC) is killed by a runner
        # shutdown signal during the final GUI links, and an OOM-killed runner agent leaves
        # nothing in the build log by construction -- so the absence of an OOM message proves
        # nothing either way. free(1) alongside the build is what settles it.
        #
        # The build runs in the background and the sampler in the foreground, NOT the other way
        # round: a backgrounded `while sleep` loop keeps stdout open, which hangs "Complete job"
        # long enough for the runner to give up and discard the log with it. This way the loop
        # ends when the build does, and `wait` still yields the build's exit code.
        run: |
          echo "cores=$(nproc)"
          free -h
          cmake --build --preset gcc-debug -- -j$(nproc) &
          build=$!
          while kill -0 "$build" 2>/dev/null; do
            echo "[mem] $(free -m | awk '/^Mem:/{printf "used=%sM avail=%sM", $3, $7}')"
            sleep 10
          done
          wait "$build"
      - name: "tests"
        # A hung test (e.g. a dead-loop) must fail the matrix fast, not stall for hours.
        #
        # Budget, measured rather than assumed: the offscreen suite is ~2 minutes here. The e2e
        # app runs and contour_gui_test dominate it (~20-30s each); the unit suites are all under
        # 3s. The two vtconformance gates would add ~3 minutes, but they self-skip on a runner
        # that has not fetched vttest/esctest. Keep an eye on this ceiling when adding an e2e run.
        # Raised to 10 on 2026-10-27: the native redesign's suites brought the run to 309 s, so 5 minutes
        # cut off a fully passing suite. Raised to 20 on 2026-10-28: the per-style GUI variants (Fluent,
        # ContourLinux) each rerun the GUI suite, and on the arm runner contour_gui_test alone takes 311 s.
        # Raised to 30 on 2026-10-30: the four GUI variants take ~1080 s on the arm runner, and the whole
        # passing suite reached 1210 s, past the 20-minute ceiling (run 40985430645).
        timeout-minutes: 30
        # ctest directly, in parallel, rather than `--target test` (serial). Tests that cannot share a
        # machine say so in their own properties (RUN_SERIAL / RESOURCE_LOCK in CMakeLists.txt).
        run: ctest --test-dir out/gcc-debug -j"$(nproc)" --output-on-failure --no-tests=error
      - name: "portal settings adapter (private session bus)"
        # Gating, unlike the weston steps: it needs a bus, not a compositor. The [portal-settings] and
        # [globalhotkey][portal] cases SKIP off a private bus (the offscreen suite above), so a SKIP here is a
        # failure, as for the tmux oracles: it would mean a D-Bus adapter never met its fake portal.
        run: |
          set -o pipefail
          sudo apt-get install -qy dbus-daemon
          output=$(QT_QPA_PLATFORM=offscreen ./scripts/run-display-tests.sh --run \
              out/gcc-debug/src/contour/contour_gui_test "[portal-settings],[globalhotkey][portal]" 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::[portal-settings],[globalhotkey][portal] reported SKIPPED; the D-Bus portal adapters are not being exercised"
            exit 1
          fi
      - name: "verify the tmux oracles actually ran"
        # ctest prints nothing for a passing test, and a Catch2 SKIP exits 0 — so "the suite is
        # green" cannot distinguish "the oracle agreed with us" from "no tmux, nothing ran". That
        # ambiguity is exactly how these tests went their whole existence without executing. Assert
        # it instead of inferring it: re-run the tagged subset and fail if anything reports skipped.
        #
        # Nothing is excluded any more: the job builds tmux 3.7b above, so the imsg oracle -- which
        # needs the framing rewritten after 3.5 and had been carved out by name ever since -- runs
        # like the rest and is held to the same "did not skip" bar.
        run: |
          set -o pipefail
          for oracle in \
              'out/gcc-debug/src/vthost/vthost_test|[oracle]' \
              'out/gcc-debug/src/contour/contour_gui_test|[oracle]'; do
            binary=${oracle%%|*}
            filter=${oracle##*|}
            echo "--- $binary $filter"
            output=$("$binary" "$filter" 2>&1) || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -q 'skipped'; then
              echo "::error::$binary $filter reported SKIPPED; the tmux interop tests are not being exercised"
              exit 1
            fi
          done
      - name: "verify the shell-integration tests actually ran"
        # @see "verify the tmux oracles actually ran": a Catch2 SKIP exits 0, so a green suite cannot
        # tell "every script works in its shell" from "no shell was installed". PowerShell included:
        # both runner images carry it (see "install the shells the shell-integration tests drive").
        run: |
          set -o pipefail
          binary=out/gcc-debug/src/contour/contour_test
          # ShellIntegrationShells.profileLine runs the line the one-click install writes, which asks the
          # contour binary for the script: outside ctest, it learns that binary here, and SKIPs without it.
          # That binary links Qt, and a runner has no display for it, as the AppImage smoke test knows.
          export QT_QPA_PLATFORM=offscreen
          export CONTOUR_BINARY="$PWD/out/gcc-debug/src/contour/contour"
          [ -x "$CONTOUR_BINARY" ] || { echo "::error::$CONTOUR_BINARY not found; profileLine would skip"; exit 1; }
          output=$("$binary" '[shells]' 2>&1) || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if printf '%s' "$output" | grep -q 'skipped'; then
            echo "::error::$binary [shells] reported SKIPPED; a shell the integration scripts target is not being exercised"
            exit 1
          fi
      - name: "verify the WebAssembly guest tests actually ran"
        # @see "verify the tmux oracles actually ran": the cases that run a Rust guest -- the bundled
        # extensions, and the spawner's end-to-end permission tests in the GUI and the daemon -- compile
        # out without the guests and leave a SKIP in their place, which exits 0. A filter that matches
        # nothing fails too, so a case that vanished is caught as well as one that skipped.
        run: |
          set -o pipefail
          for binary in \
              out/gcc-debug/src/vtextension/vtextension_test \
              out/gcc-debug/src/vthost/vthost_test \
              out/gcc-debug/src/contour/contour_gui_test; do
            echo "--- $binary [guest]"
            output=$("$binary" '[guest]' 2>&1) || { printf '%s\n' "$output"; exit 1; }
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -q 'skipped'; then
              echo "::error::$binary [guest] reported SKIPPED; the WebAssembly guest tests are not being exercised"
              exit 1
            fi
          done
      - name: "session OOM isolation under a real systemd user manager"
        # The suite above SKIPs this test -- exit 77, which ctest counts as passing -- because a
        # runner has no systemd user manager until a lingering user session starts one. Start one,
        # and demand that the test runs: a skip here is a failure.
        timeout-minutes: 10
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          export XDG_RUNTIME_DIR="/run/user/$uid"
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/bus" ] && break
            sleep 1
          done
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          CONTOUR_REQUIRE_SYSTEMD_TESTS=1 ctest --test-dir out/gcc-debug -L systemd --output-on-failure --no-tests=error
      - name: "install weston and dbus-run-session (display-gated GUI tests)"
        # Non-gating until proven on a GitHub runner: the local run is green (headless weston,
        # 32 cases), but this step has not yet been validated on ubuntu-24.04 CI, so it must not
        # be able to fail the matrix. Drop continue-on-error once a real runner has passed it.
        # dbus-daemon carries dbus-run-session, which the wrapper runs the tests under to give them
        # a private session bus.
        continue-on-error: true
        run: sudo apt-get install -qy weston qt6-wayland dbus-daemon
      - name: "display-gated GUI tests (headless weston)"
        # Real-compositor run of the [display] suite (skipped by the offscreen ctest above): a
        # private headless weston instance provides a stable Wayland compositor without GPU or X.
        continue-on-error: true
        run: ./scripts/run-display-tests.sh out/gcc-debug/src/contour/contour_gui_test
      - name: "chrome snapshots (headless weston)"
        # Review artefacts, never acceptance: every chrome row, edition and appearance as a PNG.
        # Non-gating like the display step above.
        if: ${{ matrix.artifacts }}
        continue-on-error: true
        # grabWindow() can wait forever for a frame callback; continue-on-error does not end a hang.
        timeout-minutes: 20
        run: ./scripts/run-chrome-snapshots.sh out/gcc-debug/src/contour/contour_gui_test chrome-snapshots
      - name: "Upload chrome snapshots"
        if: ${{ always() && matrix.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: chrome-snapshots
          path: chrome-snapshots/
          if-no-files-found: warn
          retention-days: 14
      - name: "Upload unit tests"
        if: ${{ matrix.artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: contour-ubuntu2404-tests
          path: |
            out/gcc-debug/src/crispy/crispy_test
            out/gcc-debug/src/vtparser/vtparser_test
            out/gcc-debug/src/vtbackend/vtbackend_test
            out/gcc-debug/src/vtbackend/bench-headless
            out/gcc-debug/src/vtrasterizer/vtrasterizer_test
            out/gcc-debug/src/vtworkspace/vtworkspace_test
            out/gcc-debug/src/vthost/vthost_test
            out/gcc-debug/src/vtconformance/vtconformance-run
            test/images
          retention-days: 1
  # }}}
  # {{{ Linux AppImage (Ubuntu 24.04: the oldest glibc the other Linux jobs support).
  package_for_AppImage:
    name: "Packaging for AppImage"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars
        run: sudo apt -qy install libxml2-utils
      - name: set environment variables
        id: set_vars
        run: ./scripts/ci-set-vars.sh
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "ccache-appimage"
          max-size: 1200M
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: "install dependencies"
        run: sudo env QTVER=6 SYSDEP_ASSUME_YES=ON ./scripts/install-deps.sh
      - name: "Post-fix embedded dependency permissions."
        run: sudo find _deps/sources -exec chown $UID {} \;
      - name: "install Rust (wasm32-wasip1)"
        run: ./scripts/install-rust-wasm.sh
      # The Qt that is bundled: Ubuntu 24.04 ships 6.4, Contour needs 6.11. Same pin, modules and
      # retry past a bad mirror as the matrix job's copy of this step.
      - name: "Install Qt"
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: "Install Qt -- retry past a bad mirror"
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: Install GCC
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo ./scripts/apt-update.sh
          sudo apt install -y g++-15
      # Qt's text-to-speech plugin links libspeechd, which linuxdeploy must find to bundle it.
      - name: "install libspeechd"
        run: sudo apt install -y libspeechd2
      - name: "build the AppImage"
        run: |
          set -euo pipefail
          CXX=g++-15 \
          VERSION_STRING="${{ steps.set_vars.outputs.VERSION_STRING }}" \
          OUTPUT_DIR="$PWD" \
              ./scripts/build-appimage.sh
          ls -lh ./*.AppImage
      # Run the bundle itself, not the build tree: a missing library, plugin or QML module is only
      # visible here. No FUSE on the runner, hence --appimage-extract-and-run, and no display either,
      # so only commands that open no window run.
      - name: "Smoke test the AppImage"
        run: |
          set -euo pipefail
          image="./contour-${{ steps.set_vars.outputs.VERSION_STRING }}-x86_64.AppImage"
          export QT_QPA_PLATFORM=offscreen
          set -x
          "$image" --appimage-extract-and-run version
          "$image" --appimage-extract-and-run help > /dev/null
          generated="$(mktemp -d)/contour.bash"
          "$image" --appimage-extract-and-run generate integration shell bash to "$generated"
          test -s "$generated"
          # The bundle carries Qt 6.11, its QML modules and the plugins the window needs.
          "$image" --appimage-extract
          test -n "$(find squashfs-root/usr/share/terminfo -type f -name contour)"
          test -f squashfs-root/usr/share/applications/org.contourterminal.Contour.desktop
          for extension in agent-status clock git plasma sysload; do
            test -f "squashfs-root/usr/share/contour/extensions/$extension.wasm"
          done
          test -d squashfs-root/usr/qml/QtQuick/Controls
          test -f squashfs-root/usr/plugins/platforms/libqxcb.so
          set +x
          ls squashfs-root/usr/plugins/platforms squashfs-root/usr/plugins/multimedia squashfs-root/usr/plugins/tls || true
          test -f squashfs-root/usr/plugins/multimedia/libffmpegmediaplugin.so
      - name: "Uploading AppImage"
        uses: actions/upload-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-x86_64.AppImage"
          path: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-x86_64.AppImage"
          if-no-files-found: error
          retention-days: 7
  # }}}
  # {{{ Ubuntu 24.04
  package_for_Ubuntu:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Packaging for Ubuntu ${{ matrix.os_version }}"
    strategy:
      fail-fast: false
      matrix:
        os_version: ['26.04']
    runs-on: ubuntu-${{ matrix.os_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars
        run: sudo apt -qy install libxml2-utils
      - name: set variables
        id: set_vars
        run: ./scripts/ci-set-vars.sh
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "ccache-ubuntu-${{ matrix.os_version }}"
          max-size: 1200M
          save: ${{ github.event_name == 'push' }}
          evict-old-files: job
      - name: "install dependencies"
        run: sudo env QTVER="${{ steps.set_qtver.outputs.QTVER }}" ./scripts/install-deps.sh
      - name: "Post-fix embedded dependency permissions."
        run: sudo find _deps/sources -exec chown $UID {} \;
      # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
      # wasm32-wasip1 target: the bundled status-line extensions, and the test guests, are Rust.
      - name: "install Rust (wasm32-wasip1)"
        run: ./scripts/install-rust-wasm.sh
      - name: "create build directory"
        run: mkdir build
      - name: Install CMake
        if: matrix.os_version != '24.04'
        uses: ssrobins/install-cmake@v1
      - name: CMake version
        run: cmake --version
      # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
      # unicode.org outage used to fail the configure step of every job at once.
      - name: "Unicode database"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _ucd
          key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
      - name: "cmake"
        run: |
          # TODO: turn on -Werror again, that requires some code changes.
          EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS"
          EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS -DCONTOUR_PACKAGE_TERMINFO=OFF"
          BUILD_DIR="build" \
            CMAKE_BUILD_TYPE=RelWithDebInfo \
            EXTRA_CMAKE_FLAGS="$EXTRA_CMAKE_FLAGS \
                               -DCMAKE_CXX_STANDARD=$CMAKE_CXX_STANDARD \
                               -DCMAKE_INSTALL_PREFIX="/usr" \
                               -DCONTOUR_TESTING=ON \
                               -DCONTOUR_WAYLAND=OFF \
                               -DLIBUNICODE_UCD_BASE_DIR=$PWD/_ucd \
                               -DPEDANTIC_COMPILER_WERROR=OFF \
                               " \
            ./scripts/ci-prepare-contour.sh
      - name: "build"
        run: cmake --build --preset gcc-release -- -j3
      - name: "tests"
        # Same reasoning as the matrix job's cap: a hung test must fail this job fast rather than
        # stall it for hours. Release rather than debug, so the budget is more generous than the
        # ~2 minutes measured there. Raised to 30 on 2026-10-30: the four GUI variants rerun the GUI suite here
        # too, contour_gui_test alone took 253 s and ContourLinux 155 s, and the step hit 10 minutes at test
        # 41 of 54 (run 41044717252).
        timeout-minutes: 30
        run: ctest --test-dir out/gcc-release -j"$(nproc)" --output-on-failure --no-tests=error
      - name: "CPack: Creating DEB package"
        run: |
          set -ex
          cpack --preset gcc-release
          OS_VERSION=${{ matrix.os_version }}
          OS_VERSION=${OS_OVERRIDE/./_}
          mv -v "./out/gcc-release/Contour-${{ steps.set_vars.outputs.VERSION_STRING }}-Linux-contour.deb" \
                "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
          mv -v "./out/gcc-release/Contour-${{ steps.set_vars.outputs.VERSION_STRING }}-Linux-contour-dbgsym.ddeb" \
                "contour-dbgsym-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.ddeb"
      - name: "Uploading artifact .deb package"
        uses: actions/upload-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
          path: |
            contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb
            contour-dbgsym-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.ddeb
          if-no-files-found: error
          retention-days: 7
      - name: "Attempt installing the created .deb"
        run: |
          sudo dpkg --install "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
          sudo dpkg --install "contour-dbgsym-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.ddeb"
      - name: "Verify installation"
        run: |
          contour version
          # The bundled status-line extensions, where an installation under /usr looks for them.
          for extension in agent-status clock git plasma sysload; do
            test -f "/usr/share/contour/extensions/$extension.wasm"
          done
  # }}}
  # {{{ Ubuntu 24.04: test via valgrind
  test_ubuntu2404_valgrind:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Run tests via valgrind"
    runs-on: ubuntu-24.04
    needs: [ubuntu_2404_cc_matrix]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
      - name: "download artifact"
        uses: actions/download-artifact@v4
        with:
          name: contour-ubuntu2404-tests
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: "fix unit test permissions"
        run: |
          find . -name '*_test' -exec chmod 0755 {} \;
          find . -name 'bench-headless' -exec chmod 0755 {} \;
      - name: "install dependencies"
        run: ./scripts/ci-install-run-deps.sh valgrind
      - name: "install the C++ runtime the test binaries were built against"
        run: ./scripts/ci-install-gcc-runtime.sh
      - name: "test: crispy (via valgrind)"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/crispy/crispy_test
      - name: "test: vtparser (via valgrind)"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/vtparser/vtparser_test
      - name: "test: vtbackend (via valgrind)"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/vtbackend/vtbackend_test
      - name: "test: vtrasterizer (via valgrind)"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/vtrasterizer/vtrasterizer_test
      # The daemon's suites. Socket buffers, coroutine frames and fd ownership are precisely the
      # code valgrind reads best, and this job is the closest thing the project has to a memory
      # gate (no ASan/TSan job exists).
      - name: "test: vtworkspace (via valgrind)"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/vtworkspace/vtworkspace_test
      - name: "test: vthost (via valgrind)"
        # ~[oracle]: the tmux interop cases fork a real tmux server over a pty and talk to it on a
        # timeout. Under valgrind the child runs at full speed while our side crawls, so those
        # budgets expire and the failure says nothing about memory. The Linux matrix runs them
        # natively and asserts they ran.
        #
        # ~[guest]: the extension cases read the spawner guest from the build tree of the job that
        # built them, which this artifact does not carry, and measure a command's teardown against its
        # timeout. The Linux matrix runs them natively and asserts they ran.
        #
        # ~[vfork]: posix_spawn reports a failed exec through memory shared with its vfork'd child,
        # which valgrind runs as a fork; the spawn then succeeds, and the child exits 127.
        #
        # --fair-sched=yes: valgrind runs one thread at a time, and its default lock lets the thread
        # that holds it take it straight back. A test driving the loop on its own thread then starved a
        # session's pump thread past the test's 10 s budget.
        run: valgrind --error-exitcode=64 --fair-sched=yes ./out/gcc-debug/src/vthost/vthost_test '~[oracle]' '~[guest]' '~[vfork]'
  # }}}
  # {{{ Ubuntu 24.04: VT conformance (esctest gates, vttest is advisory)
  test_ubuntu2404_conformance:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Run VT conformance suites"
    runs-on: ubuntu-24.04
    needs: [ubuntu_2404_cc_matrix]
    steps:
      # A full checkout, not a sparse one: the ratchet files the gate is judged against
      # (src/vtconformance/test/*.txt) and the golden dumps live in the source tree.
      - uses: actions/checkout@v4
      - name: "download artifact"
        uses: actions/download-artifact@v4
        with:
          name: contour-ubuntu2404-tests
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: "fix harness permissions"
        run: find . -name 'vtconformance-run' -exec chmod 0755 {} \;
      - name: "install dependencies"
        run: ./scripts/ci-install-run-deps.sh python3
      - name: "install the C++ runtime the test binaries were built against"
        run: ./scripts/ci-install-gcc-runtime.sh
      - name: "install vttest"
        run: ./scripts/ci/vttest-install.sh
      - name: "fetch esctest"
        run: ./scripts/fetch-esctest.sh
      # Deliberately WITHOUT --skip-if-missing. The ctest registration keeps that flag, because a
      # contributor without the suites installed should not have a red build -- but in CI a suite that
      # cannot be found has measured nothing, and must fail rather than quietly report success. That
      # silent skip is exactly the hole this job closes: the ratchets existed for months while nothing
      # in CI ever ran them.
      - name: "conformance: esctest (gating)"
        run: |
          ./out/gcc-debug/src/vtconformance/vtconformance-run run \
              --suite esctest \
              --suite-dir "$PWD/out/esctest2/esctest" \
              --known-gaps "$PWD/src/vtconformance/test/esctest-known-gaps.txt" \
              --known-failures "$PWD/src/vtconformance/test/esctest-known-failures.txt" \
              --work-dir "$PWD/out/esctest-work"
      # vttest gates per scenario (see Scenario::gatesBuild): its self-checking chapters replay a
      # recorded command file and are reproducible, so they break the build; its visual chapters are
      # still screen-driven and judged against unreviewed goldens, so they report only.
      - name: "conformance: vttest"
        run: |
          ./out/gcc-debug/src/vtconformance/vtconformance-run run \
              --suite vttest \
              --golden-dir "$PWD/src/vtconformance/test/golden" \
              --known-gaps "$PWD/src/vtconformance/test/known-gaps.txt" \
              --command-dir "$PWD/src/vtconformance/test/cmd" \
              --work-dir "$PWD/out/vttest-work"
      - name: "upload conformance transcripts"
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: contour-conformance-transcripts
          path: |
            out/esctest-work
            out/vttest-work
          retention-days: 3
  # }}}
  # {{{ Ubuntu 24.04: Test bench-headless
  test_ubuntu2404_bench_headless:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    strategy:
      matrix:
        test_case:
          [
            "grid cat",
            "grid long"
          ]
    name: "Run bench-headless"
    runs-on: ubuntu-24.04
    needs: [ubuntu_2404_cc_matrix]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
      - name: "download artifact"
        uses: actions/download-artifact@v4
        with:
          name: contour-ubuntu2404-tests
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: "fix unit test permissions"
        run: |
          find . -name '*_test' -exec chmod 0755 {} \;
          find . -name 'bench-headless' -exec chmod 0755 {} \;
      - name: "install dependencies"
        run: ./scripts/ci-install-run-deps.sh valgrind
      - name: "install the C++ runtime the test binaries were built against"
        run: ./scripts/ci-install-gcc-runtime.sh
      - name: "bench-headless: ${{ matrix.test_case }}"
        run: valgrind --error-exitcode=64 ./out/gcc-debug/src/vtbackend/bench-headless ${{ matrix.test_case }} size 1
  # }}}
  # {{{ Latency trend: in-process vs daemon, recorded on every platform, never gating
  latency_trend:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    # Records, never gates: a shared runner is too noisy to hold a 1 ms budget to, and the gate is a
    # reproducible local run (docs/internals/latency.md). What this gives is the trend -- a regression
    # shows up as a step in the artifacts across commits. continue-on-error keeps a leg that cannot
    # measure (no desktop session, a flaky Qt mirror) from failing the workflow, and no post-check job
    # lists it in `needs`.
    name: "Latency trend (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 90
    permissions:
      contents: read
      # The Windows leg's vcpkg binary cache is a NuGet feed on GitHub Packages.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: clang-release
          - os: windows-2022
            preset: clangcl-release
          - os: macos-15
            preset: appleclang-release
    env:
      CMAKE_PRESET: ${{ matrix.preset }}
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
    steps:
      - uses: actions/checkout@v4
      # {{{ Linux: the dependency steps of ubuntu_2404_cc_matrix
      - name: "update APT database"
        if: runner.os == 'Linux'
        run: sudo ./scripts/apt-update.sh
      - name: "Installing xmllint for ci-set-vars"
        if: runner.os == 'Linux'
        run: sudo apt -qy install libxml2-utils
      - name: "install dependencies"
        if: runner.os == 'Linux'
        run: sudo env QTVER=6 SYSDEP_ASSUME_YES=ON ./scripts/install-deps.sh
      - name: "install weston and dbus-run-session (the GUI needs a compositor that paints frames)"
        if: runner.os == 'Linux'
        run: sudo apt-get install -qy weston qt6-wayland dbus-daemon
      - name: "Post-fix embedded dependency permissions."
        if: runner.os == 'Linux'
        run: sudo find _deps/sources -exec chown $UID {} \;
      - name: "Install Clang"
        if: runner.os == 'Linux'
        env:
          CC_VERSION: ${{ env.LLVM_VERSION }}
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$CC_VERSION"
          sudo apt install -y "clang-$CC_VERSION"
      # }}}
      # {{{ macOS: the dependency steps of build_headless_macos, plus the Homebrew Qt its comment explains
      - name: "install dependencies (Homebrew Qt: a dev build that is never packaged)"
        if: runner.os == 'macOS'
        run: env CONTOUR_INSTALL_BREW_QT=ON QTVER=6 ./scripts/install-deps.sh
      # }}}
      # {{{ Windows: the dependency steps of the windows job
      - name: "Fetch embedded dependencies"
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install-deps.ps1 --skip-vcpkg
      - name: "Setup NuGet for vcpkg caching"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name GitHub \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
      - name: "Cache vcpkg"
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        id: vcpkg-cache
        with:
          path: ${{ runner.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      - name: "Upgrade NuGet"
        if: runner.os == 'Windows'
        run: choco upgrade nuget.commandline -y
      - name: "vcpkg: Clone and bootstrap"
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}\vcpkg
          ${{ runner.workspace }}\vcpkg\bootstrap-vcpkg.bat
          ${{ runner.workspace }}\vcpkg\vcpkg.exe fetch nuget
      - name: "vcpkg: Install dependencies"
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ runner.workspace }}\vcpkg\vcpkg.exe install --triplet x64-windows
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
      - name: "Install cmake"
        if: runner.os == 'Windows'
        uses: lukka/get-cmake@v3.29.0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # }}}
      # Qt, as the jobs above pin it: a GuiPrivate-capable one on Linux, the flat-layout 6.10 on Windows.
      # macOS builds against the Homebrew Qt of the presets.
      - name: "Install Qt (Linux)"
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: "Install Qt (Windows)"
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      # CONTOUR_EXTENSIONS_BUNDLED is on by default, and its configuration fails without cargo and the
      # wasm32-wasip1 target: the bundled status-line extensions are Rust.
      - name: "install Rust (wasm32-wasip1)"
        shell: bash
        run: ./scripts/install-rust-wasm.sh
      # The Unicode database libunicode downloads from unicode.org at configure time, kept between runs: a
      # unicode.org outage used to fail the configure step of every job at once.
      - name: "Unicode database"
        if: runner.os == 'Linux'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: _ucd
          key: ucd-${{ hashFiles('_deps/sources/libunicode-*/CMakeLists.txt') }}
      - name: "Generate build files"
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cmake --preset "$CMAKE_PRESET" \
                  -DCMAKE_CXX_COMPILER="clang++-${LLVM_VERSION}" \
                  -DCONTOUR_WAYLAND=OFF \
                  -DLIBUNICODE_UCD_BASE_DIR="$PWD/_ucd"
          else
            cmake --preset "$CMAKE_PRESET"
          fi
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
      # pwsh, not bash: Git Bash puts its own /usr/bin/link ahead of MSVC's link.exe on PATH, and cargo,
      # linking the bundled extensions' build scripts, would run that coreutils link instead.
      - name: "Build contour and bench-latency"
        shell: pwsh
        run: cmake --build --preset "$env:CMAKE_PRESET" --target contour bench-latency
      - name: "Locate the binaries"
        id: binaries
        shell: bash
        run: |
          # Where a preset puts them differs: out/<preset>/src/... on Linux and macOS (the latter inside
          # the app bundle), out/build/<preset>/bin on Windows. A missing one fails here, by name.
          bench=$(find out -type f \( -name 'bench-latency' -o -name 'bench-latency.exe' \) | head -n 1)
          contour=$(find out -type f \( -path '*/Contents/MacOS/contour' -o -name 'contour.exe' -o -path '*/src/contour/contour' \) | head -n 1)
          test -n "$bench" || { echo "::error::bench-latency was not built"; exit 1; }
          test -n "$contour" || { echo "::error::contour was not built"; exit 1; }
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
          echo "contour=$contour" >> "$GITHUB_OUTPUT"
      - name: "bench-latency headless"
        shell: bash
        run: ${{ steps.binaries.outputs.bench }} headless record latency-headless.tsv
      - name: "bench-latency e2e (headless weston)"
        if: runner.os == 'Linux'
        run: |
          ./scripts/run-display-tests.sh --run \
              "${{ steps.binaries.outputs.bench }}" e2e contour "${{ steps.binaries.outputs.contour }}" \
              cold record latency-e2e.tsv
      - name: "bench-latency e2e (the runner's desktop session)"
        if: runner.os != 'Linux'
        shell: bash
        run: |
          "${{ steps.binaries.outputs.bench }}" e2e contour "${{ steps.binaries.outputs.contour }}" \
              cold record latency-e2e.tsv
      - name: "Summarize"
        if: always()
        shell: bash
        run: |
          python=$(command -v python3 || command -v python)
          "$python" scripts/ci/latency-summary.py \
              "headless (in-process vs daemon, no GUI)=latency-headless.tsv" \
              "e2e (contour terminal vs contour client)=latency-e2e.tsv" >> "$GITHUB_STEP_SUMMARY"
      - name: "Upload the records"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "latency-${{ matrix.os }}-${{ github.sha }}"
          path: latency-*.tsv
          if-no-files-found: warn
          retention-days: 90
  # }}}
  # {{{ Ubuntu check matrix
  check_ubuntu2404_matrix_test_matrix:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: "Ubuntu Linux 24.04 post-check"
    needs:
      - package_for_Ubuntu
      - ubuntu_2404_cc_matrix
      - test_ubuntu2404_valgrind
      - test_ubuntu2404_bench_headless
      - test_ubuntu2404_conformance
    steps:
      # Uniform: every needed job must have succeeded or been skipped (on a pull request the
      # packaging, valgrind, bench and conformance jobs are skipped by design). Failed and
      # cancelled both fail the check.
      - name: Print matrix status
        run: |
          echo "Result (CC matrix)        : ${{ needs.ubuntu_2404_cc_matrix.result }}"
          echo "Result (packaging matrix) : ${{ needs.package_for_Ubuntu.result }}"
          echo "Result (valgrind)         : ${{ needs.test_ubuntu2404_valgrind.result }}"
          echo "Result (bench-headless)   : ${{ needs.test_ubuntu2404_bench_headless.result }}"
          echo "Result (conformance)      : ${{ needs.test_ubuntu2404_conformance.result }}"
      - name: Check build matrix status
        if: ${{ needs.ubuntu_2404_cc_matrix.result != 'success' && needs.ubuntu_2404_cc_matrix.result != 'skipped' }}
        run: exit 1
      - name: Check package_for_Ubuntu matrix status
        if: ${{ needs.package_for_Ubuntu.result != 'success' && needs.package_for_Ubuntu.result != 'skipped' }}
        run: exit 1
      - name: Check valgrind status
        if: ${{ needs.test_ubuntu2404_valgrind.result != 'success' && needs.test_ubuntu2404_valgrind.result != 'skipped' }}
        run: exit 1
      - name: Check bench-headless status
        if: ${{ needs.test_ubuntu2404_bench_headless.result != 'success' && needs.test_ubuntu2404_bench_headless.result != 'skipped' }}
        run: exit 1
      - name: Check conformance status
        if: ${{ needs.test_ubuntu2404_conformance.result != 'success' && needs.test_ubuntu2404_conformance.result != 'skipped' }}
        run: exit 1
      - name: "Delete artifact: contour-ubuntu2404-tests"
        uses: geekyeggo/delete-artifact@v5
        with:
          name: contour-ubuntu2404-tests
  # }}}
  # {{{ GUI: test: contour quick shell exit
  test_quick_exit:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "GUI: Quick Shell Exit"
    needs: [package_for_Ubuntu]
    strategy:
      fail-fast: false
      matrix:
        os_version: ['26.04']
    runs-on: ubuntu-${{ matrix.os_version }}
    env:
      # I'm giving up on eliminating all leaks for now.
      # There are still some deep inside Qt I can't explain myself if it's because of me.
      ASAN_OPTIONS: detect_leaks=0
      # Can be used to execute contour within a certain environment, such as valgrind:
      # Valgrind is much more precise, but 10x slower.
      CONTOUR_PREFIX: "" # valgrind --leak-check=full --num-callers=64 --error-exitcode=112"
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set environment variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - uses: actions/download-artifact@v4
      with:
        name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
    - name: "install dependencies"
      run: ./scripts/ci/notcurses-install-deps.sh
    - name: "install contour"
      # `apt-get install ./<file>.deb` (note the ./) resolves and pulls the package's declared runtime
      # dependencies (Qt6, libyaml-cpp, …) for this exact release — unlike `dpkg -i`, which fails if any
      # dependency is absent. This is why the runtime-deps script no longer hardcodes Qt package names.
      run: sudo apt-get install -y "./contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
    - name: "contour executable test"
      run: |
        contour version
        contour help
    - name: "create and patch contour.yml config file"
      run: |
        set -ex
        mkdir -p ~/.config/contour/
        contour generate config to ~/.config/contour/contour.yml
        sed -i -e 's/locator: native/locator: mock/' ~/.config/contour/contour.yml
        sed -i -e 's/strict_spacing: true/strict_spacing: false/' ~/.config/contour/contour.yml
        cat .github/mock-font-locator.yml >> ~/.config/contour/contour.yml
        cat ~/.config/contour/contour.yml
    - name: "Run Contour: quick exit"
      timeout-minutes: 5
      id: Xvfb-contour
      run: |
        ./scripts/ci/Xvfb-contour-run.sh \
              "quick-exit-dumps/${{ matrix.name }}" \
              true
    - name: "Save dump"
      uses: actions/upload-artifact@v4
      with:
        name: quick-exit-contour-dump
        path: quick-exit-dumps
        if-no-files-found: ignore
        retention-days: 1
    - name: "Check result success"
      run: |
        exit ${{ steps.Xvfb-contour.outputs.exitCode }}
  # }}}
  # {{{ GUI: external test: notcurses
  test_notcurses:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "GUI: notcurses-demo ${{ matrix.name }}"
    # Must match the OS the consumed .deb targets (26.04): a 26.04-built package links Qt 6.10 and a
    # newer libstdc++ than a 24.04 runner provides, so running it there fails with GLIBCXX/Qt-version
    # "not found" at load time.
    runs-on: ubuntu-26.04
    needs: [package_for_Ubuntu]
    strategy:
      fail-fast: false
      matrix:
        include: # {{{ (name, id) tuples
          # ixetunchmdbkywjgarvlsfqzo
          - name: 'aanimate-box-chunli-dragon-eagle-fission-grid-highcon'
            id: 'abcdefgh'
          - name: 'intro-junle-keller-luigi-mojibake-normal-outro-qrcode'
            id: 'ijklmnoq'
          - name: 'reel-sliders-trans-uniblock-view-whiteout-xray-yield-zoo'
            id: 'rstuvwxyz'
          # }}}
    env:
      LD_LIBRARY_PATH: /home/runner/opt/notcurses/lib
      # I'm giving up on eliminating all leaks for now.
      # There are still some deep inside Qt I can't explain myself if it's because of me.
      ASAN_OPTIONS: detect_leaks=0
      # Can be used to execute contour within a certain environment, such as valgrind:
      # Valgrind is much more precise, but 10x slower.
      CONTOUR_PREFIX: "" # valgrind --leak-check=full --num-callers=64 --error-exitcode=112"
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set environment variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - uses: actions/download-artifact@v4
      with:
        name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb"
    - name: "install dependencies"
      run: ./scripts/ci/notcurses-install-deps.sh
    - name: "git clone"
      run: git clone https://github.com/dankamongmen/notcurses.git
    - name: "configure cmake"
      # The smoke test only needs the notcurses-demo binary, so build the minimum: skip the C++
      # bindings and the doctest-based test suite (USE_DOCTEST/BUILD_TESTING — the source of the
      # doctest dependency that broke configure), the proof-of-concept binaries (USE_POC), and the
      # pandoc man pages. NB: the option is USE_CXX, not USE_CPP — the old -DUSE_CPP=OFF was a no-op,
      # which is why the C++/doctest path stayed enabled.
      run: |
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/home/runner/opt/notcurses \
              -DUSE_CXX=OFF \
              -DUSE_DOCTEST=OFF \
              -DBUILD_TESTING=OFF \
              -DUSE_POC=OFF \
              -DUSE_DEFLATE=OFF \
              -DUSE_MULTIMEDIA=ffmpeg \
              -DUSE_PANDOC=OFF \
              -DUSE_STATIC=ON \
              -S notcurses \
              -B notcurses/build
    - name: "Build notcurses"
      run: cmake --build notcurses/build/ -- -j3
    - name: "Install notcurses"
      run: cmake --install notcurses/build
    - name: "Run notcurses-demo -h"
      timeout-minutes: 1
      run: LD_LIBRARY_PATH="/home/runner/opt/notcurses/lib" ~/opt/notcurses/bin/notcurses-demo -p ~/opt/notcurses/share/notcurses -h
    - name: "install contour"
      # See the quick-shell-exit job: apt-get resolves the .deb's declared deps for this release.
      run: sudo apt-get install -y "./contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb"
    - name: "contour executable test"
      run: |
        contour version
        contour help
        ls -hl ~/opt/notcurses/
    - name: "create and patch contour.yml config file"
      run: |
        set -ex
        mkdir -p ~/.config/contour/
        contour generate config to ~/.config/contour/contour.yml
        sed -i -e 's/locator: native/locator: mock/' ~/.config/contour/contour.yml
        sed -i -e 's/strict_spacing: true/strict_spacing: false/' ~/.config/contour/contour.yml
        cat .github/mock-font-locator.yml >> ~/.config/contour/contour.yml
        cat ~/.config/contour/contour.yml
    - name: "Run Contour: notcurses-demo ${{ matrix.name }}"
      timeout-minutes: 5
      id: Xvfb-contour-notcurses
      run: |
        ./scripts/ci/Xvfb-contour-run.sh \
              "notcurses-demo-dumps/${{ matrix.name }}" \
              ~/opt/notcurses/bin/notcurses-demo \
                  -p ~/opt/notcurses/share/notcurses ${{ matrix.id }}
    - name: "Save dump"
      uses: actions/upload-artifact@v4
      with:
        name: notcurses-contour-dump
        path: notcurses-demo-dumps
        if-no-files-found: ignore
        retention-days: 1
    - name: "Check result success"
      run: |
        exit ${{ steps.Xvfb-contour-notcurses.outputs.exitCode }}

  check_notcurses_test_matrix:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: tests matrix
    needs: test_notcurses
    steps:
    - name: Check build matrix status
      if: ${{ needs.test_notcurses.result != 'success' && needs.test_notcurses.result != 'skipped' }}
      run: exit 1
  # }}}
  # {{{ Check Ubuntu package
  check_package_ubuntu:
    if: github.event_name != 'pull_request' || github.head_ref == 'release'
    name: "Check packages for Ubuntu "
    strategy:
      fail-fast: false
      matrix:
        os_version: ['26.04']
    runs-on: ubuntu-${{ matrix.os_version}}
    needs: [package_for_Ubuntu]
    steps:
    - uses: actions/checkout@v4
    - name: "update APT database"
      run: sudo ./scripts/apt-update.sh
    - name: Installing xmllint for ci-set-vars
      run: sudo apt -qy install libxml2-utils
    - name: set environment variables
      id: set_vars
      run: ./scripts/ci-set-vars.sh
      env:
        REPOSITORY: ${{ github.event.repository.name }}
    - uses: actions/download-artifact@v4
      with:
        name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version }}-amd64.deb"
    - name: "Check install package"
      run: |
        sudo apt install "./contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu${{ matrix.os_version}}-amd64.deb"
  # }}}
  # {{{ Release
  check_release:
    if: github.head_ref == 'release'
    name: Check Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars.sh and check-release.sh
        run: sudo apt -qy install libxml2-utils
      - name: set variables
        id: set_vars
        run: ./scripts/ci-set-vars.sh
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: run release checks
        run: ./scripts/check-release.sh

  do_release:
    if: github.head_ref == 'release'
    name: Create Github release
    runs-on: ubuntu-latest
    needs:
      - check_links
      - check_release
      - check_notcurses_test_matrix
      - macOSArm
      - package_for_AppImage
      - package_for_Ubuntu
      - check_ubuntu2404_matrix_test_matrix
      - check_package_ubuntu
      - test_quick_exit
      - package_daemon_for_Ubuntu
      - test_daemon_package_swap
      - package_for_Fedora
      - windows
    permissions:
      # We need write permissions on contents to create GitHub releases and on
      # discussions to create the release announcement in the discussion forums
      contents: write
      discussions: write
    steps:
      - uses: actions/checkout@v4
      - name: "update APT database"
        run: sudo ./scripts/apt-update.sh
      - name: Installing xmllint for ci-set-vars
        run: sudo apt -qy install libxml2-utils
      - name: set variables
        id: set_vars
        run: ./scripts/ci-set-vars.sh
        env:
          REPOSITORY: ${{ github.event.repository.name }}

      # {{{ fetch release artifacts
      - name: "fetch artifact: Ubuntu 26.04"
        uses: actions/download-artifact@v4
        with:
          name: contour-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
      # The Qt-free contour-daemon package; its .deb and -dbgsym .ddeb land beside the GUI ones and are
      # attached by the same *.deb / *.ddeb globs below.
      - name: "fetch artifact: contour-daemon (Ubuntu 24.04)"
        uses: actions/download-artifact@v4
        with:
          name: contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu24.04-amd64.deb
      - name: "fetch artifact: contour-daemon (Ubuntu 26.04)"
        uses: actions/download-artifact@v4
        with:
          name: contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-ubuntu26.04-amd64.deb
      # The Fedora RPMs (stable release only: rawhide is a canary and publishes nothing). The release
      # number follows the stable entry of package_for_Fedora's matrix.
      - name: "fetch artifact: contour RPM (Fedora 44)"
        uses: actions/download-artifact@v4
        with:
          name: contour-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora44-x86_64.rpm
      - name: "fetch artifact: contour-daemon RPM (Fedora 44)"
        uses: actions/download-artifact@v4
        with:
          name: contour-daemon-${{ steps.set_vars.outputs.VERSION_STRING }}-fedora44-x86_64.rpm
      - name: "fetch artifact: MacOS (ARM)"
        uses: actions/download-artifact@v4
        with:
          # VERSION_STRING, matching the .deb above: `version` omits the `-prerelease`
          # suffix, so a prerelease used to publish a .dmg whose name claimed otherwise.
          name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-macOS-arm.dmg"
      - name: "fetch artifact: Windows (MSI)"
        uses: actions/download-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.version }}-win64.msi"
      - name: "fetch artifact: Windows (ZIP)"
        uses: actions/download-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.version }}-win64.zip"
      - name: "fetch artifact: AppImage"
        uses: actions/download-artifact@v4
        with:
          name: "contour-${{ steps.set_vars.outputs.VERSION_STRING }}-x86_64.AppImage"
      # }}}

      - name: "inspect"
        run: ls -lisahF
      - name: inspect recurse
        run: pwd; ls -hlaR

      # -------------------------------------------------------------
      - name: Create Github release page
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # token provided by Actions
        with:
          tag_name: v${{ steps.set_vars.outputs.version }}${{ steps.set_vars.outputs.tag_suffix}}
          name: Contour ${{ steps.set_vars.outputs.version }} ${{ steps.set_vars.outputs.RELEASENAME_SUFFIX}}
          body_path: ${{ github.workspace }}/release-body.md
          draft: true
          prerelease: ${{ steps.set_vars.outputs.IS_PRERELEASE }}
          fail_on_unmatched_files: true
          files: |
            *.deb
            *.ddeb
            *.rpm
            *.dmg
            *.msi
            *.zip
            *.AppImage
  # }}}


