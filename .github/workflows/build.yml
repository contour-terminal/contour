name: Build

on:
  merge_group:
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.yml'
      - 'LICENSE.txt'
      - 'mkdocs.yml'
      - '*.md'
      - '*.sh'
    branches:
      - master
    # Only full release tags (v<major>.<minor>.<patch>). GitHub does not evaluate `paths-ignore` for
    # tag pushes, so a release tag always builds.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/*.yml'
      - 'LICENSE.txt'
      - 'mkdocs.yml'
      - '*.md'
      - '*.sh'
    branches:
      - master
      - 'maintenance/**'

concurrency:
  # A master run has a group of its own: it is never cancelled and never waits behind the previous
  # push's run, because it is the one that saves the compiler caches every pull request restores.
  # (One group for all of master queued each run behind the last, and a third push cancelled the one
  # still pending -- so a merge's caches arrived hours late or not at all.)
  group: build-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Turn the workflow lint's offline skip into a hard failure. `check-workflows.py` skips when it
  # cannot obtain actionlint, so that a fresh offline clone still gets a green `ctest`; in CI that
  # would mean a gate quietly passing because its download failed, which is worse than no gate.
  # Set at workflow level so it covers every job here that runs `ctest` -- the Linux matrix and
  # packaging jobs and the Windows and macOS jobs, all through `ctest -j`.
  CHECK_WORKFLOWS_REQUIRE_TOOL: 1
  # The LLVM/Clang toolchain version used across this workflow (clang-format, clang-tidy and the Clang
  # build matrix). clang-tidy.yml holds the one other copy; scripts/check-workflows.py fails when the
  # two differ, so an upgrade bumps both.
  LLVM_VERSION: "22"
  # How every ccache in this workflow keys an object, so that a hit does not depend on where or when
  # the object was built. BASEDIR makes paths under the checkout relative, NOHASHDIR keeps the
  # build directory out of the key, and the two sloppiness flags stop a header's mtime/ctime --
  # which a fresh checkout always changes -- from defeating a hit. (No pch_defines: there is no PCH.)
  # The caches themselves are saved by master pushes only and merely restored by every other run; see
  # docs/internals/build-times.md ("The compiler cache").
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_NOHASHDIR: "1"
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime
  # The one place where a step or script learns that it builds a release; jobs use the same condition
  # in their `if:` (docs/internals/releasing.md).
  CONTOUR_BUILD_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'prerelease' }}

# What runs where. A pull request runs the platform builds and tests (Windows, macOSArm, one Linux
# leg) plus the guard builds, the lint jobs and clang-tidy on the changed lines. Everything else --
# the other compiler legs, packaging, valgrind, conformance, bench, notcurses -- runs on master
# pushes, in the merge queue and on release tags, through `if: github.event_name != 'pull_request'`.
# That includes FreeBSD, which nothing exempts a release tag from. The full-tree clang-tidy runs on the
# same events but in a workflow of its own (clang-tidy.yml), so that its hours do not hold this one. The
# static build (`github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')`) runs on
# master and release tags and never in the merge queue. The release-only jobs use
# `startsWith(github.ref, 'refs/tags/v')`. The daemon packages: the Debian one
# (`package_daemon_for_Ubuntu`) runs on every pull request, for 24.04 alone (both releases
# otherwise), because it is the only job that builds the GUI-less configuration; the RPMs
# (`package_for_Fedora`) follow the packaging rule above.
# A required status check is never gated that way: it always runs and judges a skipped job as passed
# (scripts/check-workflows.py enforces it). See docs/internals/build-times.md.

jobs:

  windows:
    name: "Windows"
    runs-on: windows-latest
    # About twice what a green master run takes (70 minutes), rather than GitHub's 360-minute default. SignPath
    # waits for the owner's approval twice (the payload, then the installers), up to an hour each, on top of the
    # build and the checks: 300 minutes.
    timeout-minutes: ${{ vars.WINDOWS_SIGNER == 'signpath' && 300 || 150 }}
    permissions:
      contents: read
      packages: write
      # The SignPath action reads this run's artifacts with GITHUB_TOKEN.
      actions: read
    # Signs when a signer is configured (repository variable WINDOWS_SIGNER: signpath, certum or sslcom) and the
    # build is a release tag, or a master push when WINDOWS_SIGNING_BUILDS is releases-and-master. Only then does
    # the job enter the release-signing environment, which holds the credentials and the owner's approval rule.
    # The condition is spelled twice, here and in the concurrency group, because neither can read a step's output:
    # the two copies must stay identical. `plan` decides the same again from the same variables, and is what the
    # steps follow; a copy that went wrong shows as secrets that are missing, never as an unsigned release. Both
    # variables have to be repository variables, since an environment's own variables are not visible before the
    # job has its environment. How it works, and how to turn it on: docs/internals/release-signing.md.
    environment: ${{ ((vars.WINDOWS_SIGNER != '' && vars.WINDOWS_SIGNER != 'none') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.WINDOWS_SIGNING_BUILDS == 'releases-and-master'))) && 'release-signing' || '' }}
    # One signing job at a time: a one-time code is single use, and two jobs logging in within its 30 seconds
    # collide. Jobs that do not sign get a group of their own and wait for nobody.
    concurrency:
      group: ${{ ((vars.WINDOWS_SIGNER != '' && vars.WINDOWS_SIGNER != 'none') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.WINDOWS_SIGNING_BUILDS == 'releases-and-master'))) && 'release-signing' || format('windows-{0}-{1}', github.run_id, github.run_attempt) }}
      cancel-in-progress: false
    env:
      CCACHE_DEBUG: "1"
      CCACHE_DEBUGDIR: D:\a\ccache-debug
      CCACHE_LOGFILE: D:\a\ccache-debug\ccache.log
      CMAKE_PRESET: "msvc-release"
      VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The pinned lint tools (actionlint, typos) that `check_workflows` and `check_spelling` download from
      # GitHub release assets on first use, kept between runs: a release-asset outage (HTTP 504 for hours,
      # once) used to fail every job that runs the lint ctest, since CHECK_WORKFLOWS_REQUIRE_TOOL turns the
      # skipped download into a failure. The key is the files that pin the versions, so a hit needs no
      # download and a bump fetches once. scripts/lib/toolcache.py also retries a download that does miss.
      - name: "Lint tools"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: out/.tools
          key: lint-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/check-workflows.py', 'scripts/check-spelling.py') }}
      # ccache, not sccache: cmake/CompileCache.cmake picks the ccache on PATH, and with it forces
      # /Z7 (debug info inside the .obj) in place of /Zi, which no launcher can cache. The action
      # installs ccache 4.9 and sets compiler_check=content on Windows, where the compiler's mtime
      # follows the image's install time. The statistics step at the end names the binary CMake used
      # and the cache directory it read, so a mismatch with the restored one shows in the log.
      - name: ccache
        uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          key: ccache-windows-msvc-release
          max-size: 2700M
          save: ${{ github.ref == 'refs/heads/master' }}
          evict-old-files: job
      - name: setup environment
        shell: powershell
        id: set_vars
        run: .\scripts\ci-set-vars.ps1
        env:
          REPOSITORY: ${{ github.event.repository.name }}
      - name: "Name the packages"
        if: github.event_name != 'pull_request'
        shell: pwsh
        # The packages CPack leaves in the build directory, as paths relative to the workspace: every later step
        # that names one reads these.
        run: |
          $directory = "out/build/$env:CMAKE_PRESET"
          $version = '${{ steps.set_vars.outputs.version }}'
          "CONTOUR_MSI=$directory/contour-$version-win64.msi" >> $env:GITHUB_ENV
          "CONTOUR_USER_MSI=$directory/contour-$version-win64-user.msi" >> $env:GITHUB_ENV
          "CONTOUR_ZIP=$directory/contour-$version-win64.zip" >> $env:GITHUB_ENV
      - name: "Fetch embedded dependencies"
        shell: powershell
        run: |
          ./scripts/install-deps.ps1 --skip-vcpkg
          type ./_deps/sources/CMakeLists.txt
      - name: Install Qt
        # Attempted twice, for the bad-mirror failure documented at the clang-tidy job's copy of
        # this step; only a repeated failure fails the job.
        id: install_qt
        continue-on-error: true
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          # 6.10, not the 6.11 the other platforms pin: Qt restructured its Windows package
          # repository at 6.11 into per-architecture subdirectories
          # (qt6_6111/qt6_6111_msvc2022_64/Updates.xml) where every release up to 6.10 kept a flat
          # one (qt6_6103/Updates.xml). aqtinstall still requests the flat path, so a 6.11 install
          # here dies with "Failed to locate XML data for Qt version '6.11.1'". 3.3.0 is its latest
          # release, so there is nothing newer to move to; Linux and macOS are unaffected because
          # their repositories stayed flat.
          #
          # 6.10 carries all four modules below, so this costs no feature -- only the configure-time
          # notice that the detected Qt is older than the version Contour is tested against. Raise
          # this to "6.11.*" once aqtinstall learns the new layout.
          version: "6.10.*"
          #version: "5.15.*"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: Install Qt -- retry past a bad mirror
        if: steps.install_qt.outcome == 'failure'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: "6.10.*"
          modules: qtmultimedia qt5compat qtshadertools qtspeech
      - name: "Setup NuGet for vcpkg caching"
        shell: bash
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name GitHub \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
      - name: "Cache vcpkg"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: vcpkg-cache
        with:
          path: ${{ runner.workspace }}/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
      - name: "Upgrade NuGet"
        run: |
          choco upgrade nuget.commandline -y
      - name: "vcpkg: Clone and bootstrap"
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ${{ runner.workspace }}\vcpkg
          ${{ runner.workspace }}\vcpkg\bootstrap-vcpkg.bat
          ${{ runner.workspace }}\vcpkg\vcpkg.exe fetch nuget
        env:
          VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
      - name: "vcpkg: Install dependencies"
        shell: pwsh
        run: |
          ${{ runner.workspace }}\vcpkg\vcpkg.exe install --triplet x64-windows
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
          VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"
      # CMake 3.30 is the first to honour CPACK_WIX_VERSION: older ones run WiX 3's candle and light whatever
      # WiX the next step installs.
      - name: "Install cmake"
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - name: "Check cmake version"
        run: cmake --version
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: "install Rust (wasm32-wasip1)"
        # @see the same step on Linux: the bundled extensions and the test guests are Rust.
        shell: bash
        run: ./scripts/install-rust-wasm.sh
      - name: "Generate build files"
        shell: pwsh
        run: |
          cmake --preset ${{ env.CMAKE_PRESET }}
        env:
          VCPKG_ROOT: "${{ runner.workspace }}/vcpkg"
      - name: "Build"
        shell: pwsh
        run: |
          cmake --build --preset ${{ env.CMAKE_PRESET }} --target vtparser crispy
      - name: "Show ccache statistics"
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          (Get-Command ccache).Source
          ccache --version
          ccache --show-config | Select-String -Pattern 'cache_dir|max_size|compiler_check|sloppiness|base_dir'
          ccache -s
      - name: "ccache: verbose statistics and configuration"
        if: always()
        shell: pwsh
        run: |
          ccache --show-config
          ccache -svv
          Get-ChildItem Env: | Sort-Object Name | ForEach-Object { "$($_.Name)=$($_.Value)" } | Out-File D:\a\ccache-debug\environment.txt
      - name: "upload the ccache debug files"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccache-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: D:\a\ccache-debug
          retention-days: 3
