# Spell check.
#
# This lives in its own workflow rather than in build.yml on purpose: build.yml carries a
# `paths-ignore` for `docs/**`, `*.md` and `*.sh`, so a documentation-only change never ran the
# spell gate at all -- the one kind of change most likely to introduce a typo. The check now costs
# about a second, so it is cheap to run on everything.
#
# The job runs `scripts/check-spelling.py`, the very same script `ctest -L lint` runs, at the same
# pinned typos version. That is what keeps a local pre-flight and this gate from disagreeing.
#
# One Linux job is enough here: the gate reads the same files whatever host it runs on, so running
# it per-platform in CI would only cost minutes. The point of the script being Python rather than
# shell is that `ctest -L lint` can run it on Windows and macOS too — for a developer on either,
# and in the Windows, macOS and FreeBSD CI jobs, which all invoke `ctest`. (The FreeBSD job excludes
# the `lint` label to keep its VM budget, so it is the one that does not pick the gate up.)

name: Spelling

on:
  merge_group:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: spelling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check_spelling:
    name: Check spelling
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "Checking spelling"
        # Turn the script's offline skip into a hard failure: a gate that silently passes because
        # it could not download its tool is worse than no gate.
        env:
          CHECK_SPELLING_REQUIRE_TOOL: 1
        run: python3 scripts/check-spelling.py
