name: Docs

on:
  merge_group:
  # Redeploying the docs is sometimes necessary after a commit that touches no documentation at all:
  # this job builds `contour` to generate half the site, so anything that breaks or fixes the build
  # decides whether the site can be published, while the paths filter below -- rightly -- does not
  # fire for it. That is not hypothetical; it is exactly the situation this was added in, with the
  # last run red from a compile error whose fix touched only src/net. Re-running the old run is no
  # answer either, since it replays the commit that failed. Without a manual trigger the only way to
  # redeploy was to invent a commit under docs/.
  workflow_dispatch:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'metainfo.xml'
    branches:
      - master

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs:
    name: Deploy docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Extract changes for the releases from metainfo.xml
        run: |
          ./scripts/extract-changelog-from-metainfo.py metainfo.xml docs/release-notes.md

      - name: "update APT database"
        run: sudo apt -q update
      - name: "Install GCC"
        # gcc-14 as well as g++-14: the compiler is named explicitly at configure time below, so the
        # C driver has to exist under that name too (g++-14 does depend on it, but the build should
        # not lean on a transitive dependency for a tool it invokes by name).
        run: sudo apt -y install gcc-14 g++-14
      - name: "install dependencies"
        run: sudo env QTVER=6 SYSDEP_ASSUME_YES=ON ./scripts/install-deps.sh
      - name: "Post-fix embedded dependency permissions."
        run: sudo find _deps/sources -exec chown $UID {} \;
      - name: "create build directory"
        run: mkdir build
      # Every `contour documentation ...` verb below is registered by ContourApp and reads only
      # Qt-free sources (vtbackend's function table, contour::actions, contour::config), so docs
      # generation has no use for the GUI frontend -- and building it here is what broke this
      # workflow: Ubuntu 24.04's distro Qt is 6.4.2, whose Qt6::QmlPrivate names an include path it
      # does not ship, which fails the configure step outright. The build matrix works around that
      # by installing a modern Qt over the distro one; this job needs no Qt at all, so it opts out
      # instead. CMAKE_DISABLE_FIND_PACKAGE_Qt6 makes every find_package(Qt6 ...) fail, so the build
      # cannot merely happen to pick up whichever Qt is lying around -- same assertion as the
      # "Ubuntu Linux (no GUI frontend)" job in build.yml.
      #
      # The compiler is named rather than left to the default: this job installs g++-14, but that
      # does not make it the default -- Ubuntu 24.04's `g++` is 13.3, whose libstdc++ has no
      # std::ranges::to (C++23, and GCC 14 is where it arrived), so vtbackend/core/Color.cpp fails with
      # "'to' is not a member of 'std::ranges'". This job takes the gcc-debug preset's
      # PEDANTIC_COMPILER_WERROR=ON, which the build matrix passes OFF, so it is the strictest GCC
      # build in the tree and the only one that has to be told which GCC to be.
      - name: "Install-contour"
        run: |
          cmake --preset gcc-debug \
                -B build \
                -G Ninja \
                -D CMAKE_C_COMPILER=gcc-14 \
                -D CMAKE_CXX_COMPILER=g++-14 \
                -D CONTOUR_WAYLAND=OFF \
                -D CONTOUR_FRONTEND_GUI=OFF \
                -D CMAKE_DISABLE_FIND_PACKAGE_Qt6=ON
      - name: "build"
        run: cmake --build build --target contour
      - name: "create vt-sequence directory"
        run: mkdir docs/vt-sequence
      - name: "Generate documentation for global config"
        run: ./build/src/contour/contour documentation configuration global > docs/configuration/index.md
      - name: "Generate documentation for profile config"
        run: ./build/src/contour/contour documentation configuration profile > docs/configuration/profiles.md
      - name: "Generate vt documentation"
        run: ./build/src/contour/contour documentation vt > docs/vt-sequence/index.md
      - name: "Generate key mapping documentation"
        run: ./build/src/contour/contour documentation keys >> docs/configuration/key-mapping.md

      - name: Deploy docs
        uses: mhausenblas/mkdocs-deploy-gh-pages@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_DOMAIN: contour-terminal.org
          CONFIG_FILE: ./mkdocs.yml
          EXTRA_PACKAGES: build-base
          REQUIREMENTS: docs/requirements.txt


