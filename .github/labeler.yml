CI:
    - .github/**
CMake:
    - "**CMakeLists.txt"
    - cmake/**
"VT: backend":
    - src/vtbackend/**/*.cpp
    - src/vtbackend/**/*.hpp
    - src/vtpty/*.cpp
    - src/vtpty/*.hpp
    - src/vtparser/*.cpp
    - src/vtparser/*.hpp
"VT: rasterizer":
    - src/vtrasterizer/*.cpp
    - src/vtrasterizer/*.hpp
    # shared_defines.h keeps its .h: it is shared with GLSL, not a C++ header.
    - src/vtrasterizer/*.h
documentation:
    - "**/*.md"
    - docs/**
fonts:
    - src/text_shaper/*.cpp
    - src/text_shaper/*.hpp
frontend:
    - src/contour/**
test:
    - src/**/*_test.cpp
