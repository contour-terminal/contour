site_name: Contour Terminal Emulator
dev_addr: 0.0.0.0:8080
docs_dir: docs
repo_url: https://github.com/contour-terminal/contour/
repo_name: contour-terminal/contour
site_description: Technical Landing Page for Contour Terminal Emulator
site_author: Christian Parpart
edit_uri: edit/master/docs/
# Any warning fails the build, the CI deploy's included, and a link to a heading that does not exist is one.
strict: true
validation:
  links:
    anchors: warn
theme:
  name: null
  custom_dir: website/theme
  static_templates:
    - 404.html
  search_index_only: true # keeps the search plugin from copying its lunr/worker scripts
hooks:
  - website/hooks.py
watch:
  - website/theme
exclude_docs: |
  internals/
  CONTRIBUTING.md
  superpowers/
  drafts/
  configuration/advanced/
  vt-extensions/csi-u-extended-keyboard-protocol.md
  configuration/key-mapping-actions.md
  requirements.txt
extra:
  generated_pages:
    - configuration/index.md
    - configuration/profiles.md
    - vt-sequence/index.md
    - release-notes.md
markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [!relative $docs_dir]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

plugins:
  - mkdocs-video:
      is_video: True
      video_muted: True
      video_controls: True
      css_style:
        width: "100%"
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])'
  - redirects:
      redirect_maps:
        demo/font-ligatures.md: features.md#font-ligatures
        demo/images.md: features.md#images
        demo/ime.md: features.md#input-method-editor
        demo/size_indicator.md: features.md#size-indicator
        demo/input-modes.md: input-modes.md#select-and-yank
        demo/line-marks.md: input-modes.md#line-marks
        demo/statusline.md: configuration/indicator-statusline.md#host-programmable-status-line
        demo/git-branch-drawings.md: configuration/index.md#git_drawings
        vt-extensions/index.md: vt-extensions/synchronized-output.md
        internals/CODING_STYLE.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/CODING_STYLE.md
        internals/build-times.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/build-times.md
        internals/index.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/index.md
        internals/kitty-placeholders.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/kitty-placeholders.md
        internals/keyboard-input.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/keyboard-input.md
        internals/latency.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/latency.md
        internals/macos-code-signing.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/macos-code-signing.md
        internals/native-chrome.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/native-chrome.md
        internals/profiling.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/profiling.md
        internals/release-builds.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/release-builds.md
        internals/release-signing.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/release-signing.md
        internals/releasing.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/releasing.md
        internals/sanitizers.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/sanitizers.md
        internals/session-oom-isolation.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/session-oom-isolation.md
        internals/software-architecture/index.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/software-architecture/index.md
        internals/spell-checking.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/spell-checking.md
        internals/text-stack.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/text-stack.md
        internals/vt-conformance.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/vt-conformance.md
        internals/vthost.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/vthost.md
        internals/windows-cross-build.md: https://github.com/contour-terminal/contour/blob/master/docs/internals/windows-cross-build.md
        CONTRIBUTING.md: https://github.com/contour-terminal/contour/blob/master/docs/CONTRIBUTING.md
        vt-extensions/csi-u-extended-keyboard-protocol.md: https://github.com/contour-terminal/contour/blob/master/docs/vt-extensions/csi-u-extended-keyboard-protocol.md

# Page tree: three workspaces, optional groups inside them. Navigation is data.
nav:
  - contour:
    - home: index.md
    - install: install.md
    - features: features.md
    - release notes: release-notes.md
    - guides:
      - persistent sessions: persistent-sessions.md
      - workspace sidebar: sidebar.md
      - remote hosts: remote-hosts.md
      - control api: control-api.md
      - command blocks: demo/command-blocks.md
      - hint mode: demo/hint-mode.md
      - input modes: input-modes.md
      - drag and drop: demo/drag-and-drop.md
      - status-line extensions: extensions.md
      - quick terminal: quick-terminal.md
      - accessibility: accessibility.md
      - secure input: secure-input.md
  - configure:
    - config file: configuration/index.md
    - profiles: configuration/profiles.md
    - settings window: configuration/settings.md
    - colors: configuration/colors.md
    - key mapping: configuration/key-mapping.md
    - more:
      - layouts: configuration/layouts.md
      - links: configuration/links.md
      - hosts: configuration/hosts.md
      - status line: configuration/indicator-statusline.md
      - paths: configuration/paths.md
  - reference:
    - vt sequences: vt-sequence/index.md
    - regis graphics: demo/regis-graphics.md
    - extensions:
      - synchronized output: vt-extensions/synchronized-output.md
      - shell integration: vt-extensions/osc-133-shell-integration.md
      - clickable links: vt-extensions/clickable-links.md
      - buffer capture: vt-extensions/buffer-capture.md
      - program status: vt-extensions/program-status.md
      - semantic block query: vt-extensions/semantic-block-query.md
      - "progress (osc 9;4)": vt-extensions/osc-9-4-progress.md
      - "context (osc 3008)": vt-extensions/osc-3008-context.md
      - vertical line marks: vt-extensions/vertical-line-marks.md
      - palette notifications: vt-extensions/color-palette-update-notifications.md
      - font settings: vt-extensions/font-settings.md
      - kitty graphics placeholders: vt-extensions/kitty-graphics.md
      - line reflow mode: vt-extensions/line-reflow-mode.md
      - private-use glyphs: vt-extensions/private-use-glyphs.md
      - save and restore sgr: vt-extensions/save-and-restore-sgr-attributes.md
      - unicode core: vt-extensions/unicode-core.md
